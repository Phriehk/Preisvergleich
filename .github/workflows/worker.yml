# Lädt Seite und Server (Cloudflare Worker, Ordner worker/) hoch und testet beides.
name: Worker hochladen

on:
  push:
    branches: [main]
    paths: ["worker/**", "index.html", "sw.js", "manifest.webmanifest", "*.png", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      ZUGANGSCODE: ${{ secrets.ZUGANGSCODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Hochladen und testen
        working-directory: worker
        run: |
          LOG=deploy-log.txt; : > $LOG
          log(){ echo "$@" | tee -a $LOG; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { log "FEHLER: Secret CLOUDFLARE_API_TOKEN fehlt"; exit 1; }
          API=https://api.cloudflare.com/client/v4
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ACC=$(curl -s -H "$H" "$API/accounts" | jq -r '.result[0].id // empty')
          [ -n "$ACC" ] || { log "FEHLER: Cloudflare-Konto nicht gefunden"; exit 1; }
          export CLOUDFLARE_ACCOUNT_ID=$ACC
          SUB=$(curl -s -H "$H" "$API/accounts/$ACC/workers/subdomain" | jq -r '.result.subdomain // empty')
          log "workers.dev-Subdomain: $SUB"
          # die Seite wird zusammen mit dem Server ausgeliefert
          mkdir -p public
          cp ../index.html ../sw.js ../manifest.webmanifest ../icon-192.png ../icon-512.png ../icon-maskable-192.png ../icon-maskable-512.png ../apple-touch-icon.png public/
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tail -n 14 | tee -a $LOG
          # Geheimnisse (nur beim Server hinterlegt, nie im Repository)
          [ -n "$NTFY_TOPIC" ] && { echo "$NTFY_TOPIC" | npx --yes wrangler@4 secret put NTFY_TOPIC 2>&1 | tail -n 1 | tee -a $LOG; }
          # Zugangscode: eigenes Passwort aus dem GitHub-Secret ZUGANGSCODE, sonst wie bisher aus dem Cloudflare-Schlüssel abgeleitet
          if [ -n "$ZUGANGSCODE" ]; then ZUG="$ZUGANGSCODE"; log "Zugangscode: eigenes Passwort (Secret ZUGANGSCODE)"; else ZUG=$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-10); log "Zugangscode: abgeleitet aus dem Cloudflare-Schlüssel (Secret ZUGANGSCODE fehlt)"; fi
          echo "$ZUG" | npx --yes wrangler@4 secret put ZUGANG 2>&1 | tail -n 1 | tee -a $LOG
          KEY=$(openssl rand -hex 24)
          echo "$KEY" | npx --yes wrangler@4 secret put WARTUNG 2>&1 | tail -n 1 | tee -a $LOG
          # alter Server mit dem langen Namen wird nicht mehr gebraucht
          log "Alten Server entfernt: $(curl -s -X DELETE -H "$H" "$API/accounts/$ACC/workers/scripts/preisvergleich" | jq -c '{success}')"
          URL="https://preise.$SUB.workers.dev"
          echo "{\"url\": \"$URL\"}" > ../worker.json
          set +e
          for i in $(seq 1 24); do curl -sf -m 20 "$URL/status" >/dev/null && break; sleep 10; done
          log "Status: $(curl -s -m 30 $URL/status)"
          log "Seite: $(curl -s -m 30 $URL/ | grep -o '<title>[^<]*</title>')"
          log "Ohne Code schreiben: HTTP $(curl -s -o /dev/null -w '%{http_code}' -m 30 -X POST $URL/aktualisieren)"
          log "Mit Code, leere Suche (erwartet 400): HTTP $(curl -s -o /dev/null -w '%{http_code}' -m 30 -X POST -H "Authorization: Bearer $ZUG" "$URL/suche?q=")"
          T0=$(date +%s); R=$(curl -s -m 120 -X POST -H "Authorization: Bearer $ZUG" "$URL/suche?q=Fanta")
          log "Suche Fanta: $(( $(date +%s) - T0 )) s, $(echo "$R" | jq -c 'if type=="array" then {anzahl: length} else . end' 2>/dev/null || echo "$R" | head -c 300)"
          sleep 8   # frisch gesetzte Geheimnisse brauchen einen Moment, bis alle Rechenzentren sie kennen
          T0=$(date +%s); R=$(curl -s -m 300 -X POST -H "X-Wartung: $KEY" "$URL/aktualisieren")
          echo "$R" | grep -q "Zugangscode" && { sleep 20; T0=$(date +%s); R=$(curl -s -m 300 -X POST -H "X-Wartung: $KEY" "$URL/aktualisieren"); }
          log "Aktualisieren: $(( $(date +%s) - T0 )) s, $(echo "$R" | head -c 400)"
          log "Angebote: $(curl -s -m 30 $URL/angebote.json | jq -c '{anzahl: length, gruppen: ([.[].gruppe] | unique)}' 2>/dev/null)"
          log "Verlauf: $(curl -s -m 30 $URL/verlauf.csv | wc -l) Zeilen"
          log "Korrekturen lesen: $(curl -s -m 30 $URL/korrekturen.json | head -c 100)"
          log "Korrekturen ohne Code schreiben (erwartet 401): HTTP $(curl -s -o /dev/null -w '%{http_code}' -m 30 -X POST -H 'Content-Type: application/json' -d '{"set":{}}' $URL/korrekturen)"
          curl -s -m 30 -X POST -H "Authorization: Bearer $ZUG" -H 'Content-Type: application/json' -d '{"set":{"test|1":{"preis":1.5,"stueck":2,"ml":500}}}' $URL/korrekturen >/dev/null
          log "Korrektur gespeichert und gelesen: $(curl -s -m 30 $URL/korrekturen.json | jq -c 'has("test|1")')"
          curl -s -m 30 -X POST -H "Authorization: Bearer $ZUG" -H 'Content-Type: application/json' -d '{"del":["test|1"]}' $URL/korrekturen >/dev/null
          log "Test-Korrektur gelöscht: $(curl -s -m 30 $URL/korrekturen.json | jq -c 'has("test|1") | not')"
          T0=$(date +%s); R=$(curl -s -m 120 -X POST -G -H "Authorization: Bearer $ZUG" --data-urlencode "m=Lidl|ALDI SÜD|Kaufland|REWE|PENNY (46535)|Netto Marken-Discount|trinkgut|Thomas Philipps|Handelshof|ROSSMANN" "$URL/entfernungen")
          log "Entfernungen: $(( $(date +%s) - T0 )) s, $(echo "$R" | jq -c 'with_entries(.value |= {km: .km, fil: ((.filialen // []) | length)})' 2>/dev/null || echo "$R" | head -c 300)"
          T0=$(date +%s); R=$(curl -s -m 120 "$URL/region?plz=40210&q=Fanta%7CRed%20Bull")
          log "Region 40210 ohne Code: $(( $(date +%s) - T0 )) s, $(echo "$R" | jq -c 'if type=="array" then {anzahl: length, maerkte: ([.[].markt] | unique | .[0:6])} else . end' 2>/dev/null || echo "$R" | head -c 300)"
          log "Region ungültige PLZ (erwartet 400): HTTP $(curl -s -o /dev/null -w '%{http_code}' -m 30 "$URL/region?plz=abc&q=x")"
          T0=$(date +%s); R=$(curl -s -m 120 -G --data-urlencode "plz=47178" --data-urlencode "q=Butter|Eier|Milch|Reis|Äpfel|Mehl" --data-urlencode "streng=1" "$URL/region")
          log "Lebensmittel-Probe: $(( $(date +%s) - T0 )) s, $(echo "$R" | jq -c 'if type=="array" then (group_by(.gruppe) | map({(.[0].gruppe): length}) | add) else . end' 2>/dev/null || echo "$R" | head -c 300)"
          echo "$R" | jq -r 'if type=="array" then .[0:40][] | "  Probe: \(.gruppe) | \(.markt) | \(.produkt[0:28]) | art=\(.art) liter=\(.liter) stueck=\(.stueck) ml=\(.ml) preis=\(.preis) | \(.beschreibung[0:70])" else empty end' 2>/dev/null | while IFS= read -r z; do log "$z"; done
          R=$(curl -s -m 60 -G --data-urlencode "plz=40210" --data-urlencode "m=Lidl|REWE|ALDI SÜD" "$URL/entfernungen")
          log "Entfernungen 40210, erste Antwort: $(echo "$R" | head -c 200)"
          sleep 40
          R=$(curl -s -m 60 -G --data-urlencode "plz=40210" --data-urlencode "m=Lidl|REWE|ALDI SÜD" "$URL/entfernungen")
          log "Entfernungen 40210, nach 40 s: $(echo "$R" | jq -c 'with_entries(.value |= {km: .km, fil: ((.filialen // []) | length)})' 2>/dev/null || echo "$R" | head -c 300)"
          DK=$(openssl rand -hex 32); KN="test$(date +%s)"
          J() { curl -s -m 30 -X POST -H 'Content-Type: application/json' "$@"; }
          R=$(J -d "{\"name\":\"$KN\",\"dk\":\"$DK\"}" $URL/konto/neu); TOK=$(echo "$R" | jq -r '.token // empty')
          log "Konto anlegen: $(echo "$R" | jq -c '{name: .name, token: (.token != null)}' 2>/dev/null || echo "$R" | head -c 200)"
          log "Konto doppelt (erwartet 409): HTTP $(curl -s -o /dev/null -w '%{http_code}' -m 30 -X POST -H 'Content-Type: application/json' -d "{\"name\":\"$KN\",\"dk\":\"$DK\"}" $URL/konto/neu)"
          log "Konto falsches Passwort (erwartet 401): HTTP $(curl -s -o /dev/null -w '%{http_code}' -m 30 -X POST -H 'Content-Type: application/json' -d "{\"name\":\"$KN\",\"dk\":\"$(openssl rand -hex 32)\"}" $URL/konto/login)"
          curl -s -m 30 -X PUT -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' -d '{"km":0.4,"eink":["a|b"]}' $URL/konto/daten >/dev/null
          log "Konto Daten: $(curl -s -m 30 -H "Authorization: Bearer $TOK" $URL/konto/daten | head -c 200)"
          log "Konto Anfragen ohne Code (erwartet 401): HTTP $(curl -s -o /dev/null -w '%{http_code}' -m 30 $URL/konto/anfragen)"
          J -d "{\"name\":\"$KN\"}" $URL/konto/vergessen >/dev/null
          log "Konto Anfragen mit Code: $(curl -s -m 30 -H "Authorization: Bearer $ZUG" $URL/konto/anfragen | jq -c '[.[].name | select(. == "'$KN'")]' 2>/dev/null)"
          R=$(J -H "Authorization: Bearer $ZUG" -d "{\"name\":\"$KN\"}" $URL/konto/code); CODE=$(echo "$R" | jq -r '.code // empty')
          log "Wiederherstellcode erzeugt: ${#CODE} Zeichen"
          DK2=$(openssl rand -hex 32)
          R=$(J -d "{\"name\":\"$KN\",\"code\":\"$CODE\",\"dk\":\"$DK2\"}" $URL/konto/neues-passwort); TOK2=$(echo "$R" | jq -r '.token // empty')
          log "Neues Passwort mit Code: $(echo "$R" | jq -c '{name: .name, token: (.token != null)}' 2>/dev/null)"
          log "Alte Sitzung nach Passwortwechsel (erwartet 401): HTTP $(curl -s -o /dev/null -w '%{http_code}' -m 30 -H "Authorization: Bearer $TOK" $URL/konto/daten)"
          log "Code ein zweites Mal (erwartet Fehler): HTTP $(curl -s -o /dev/null -w '%{http_code}' -m 30 -X POST -H 'Content-Type: application/json' -d "{\"name\":\"$KN\",\"code\":\"$CODE\",\"dk\":\"$DK\"}" $URL/konto/neues-passwort)"
          log "Konto löschen: HTTP $(curl -s -o /dev/null -w '%{http_code}' -m 30 -X POST -H "Authorization: Bearer $TOK2" -H 'Content-Type: application/json' -d "{\"dk\":\"$DK2\"}" $URL/konto/loeschen)"
          openssl rand -hex 24 | npx --yes wrangler@4 secret put WARTUNG >/dev/null 2>&1   # Testschlüssel wieder unbrauchbar machen
          rm -rf public
      - name: Ergebnis speichern
        if: always()
        run: |
          git config user.name "preisvergleich-bot"
          git config user.email "preisvergleich-bot@users.noreply.github.com"
          # Auch bei einem erneuten Lauf eines älteren Stands: Ergebnis auf den neuesten Stand von main legen
          mkdir -p /tmp/erg; cp worker/deploy-log.txt /tmp/erg/ 2>/dev/null; cp worker.json /tmp/erg/ 2>/dev/null
          git fetch -q origin main && git reset -q --hard origin/main
          cp /tmp/erg/deploy-log.txt worker/deploy-log.txt 2>/dev/null; cp /tmp/erg/worker.json worker.json 2>/dev/null
          git add worker/deploy-log.txt worker.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "Worker hochgeladen" && git push origin HEAD:main; }
