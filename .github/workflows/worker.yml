# Lädt den Cloudflare Worker hoch (Ordner worker/) und testet ihn danach.
name: Worker hochladen

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Hochladen und testen
        working-directory: worker
        run: |
          set -o pipefail
          LOG=deploy-log.txt; : > $LOG
          log(){ echo "$@" | tee -a $LOG; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { log "FEHLER: Secret CLOUDFLARE_API_TOKEN fehlt"; exit 1; }
          API=https://api.cloudflare.com/client/v4
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          log "Token: $(curl -s -H "$H" $API/user/tokens/verify | jq -c '{success, status: .result.status, errors}')"
          ACC=$(curl -s -H "$H" "$API/accounts" | jq -r '.result[0].id // empty')
          log "Konto gefunden: $([ -n "$ACC" ] && echo ja || echo nein)"
          export CLOUDFLARE_ACCOUNT_ID=$ACC
          SUB=$(curl -s -H "$H" "$API/accounts/$ACC/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            for name in phriehk phriehk-pv preisvergleich-phriehk; do
              R=$(curl -s -X PUT -H "$H" -H "Content-Type: application/json" -d "{\"subdomain\":\"$name\"}" "$API/accounts/$ACC/workers/subdomain")
              log "Subdomain $name: $(echo "$R" | jq -c '{success, errors}')"
              SUB=$(echo "$R" | jq -r '.result.subdomain // empty'); [ -n "$SUB" ] && break
            done
          fi
          log "workers.dev-Subdomain: $SUB"
          npx --yes wrangler@4 deploy 2>&1 | tail -n 25 | tee -a $LOG
          [ -n "$NTFY_TOPIC" ] && { echo "$NTFY_TOPIC" | npx --yes wrangler@4 secret put NTFY_TOPIC 2>&1 | tail -n 3 | tee -a $LOG; }
          KEY=$(openssl rand -hex 24)
          echo "$KEY" | npx --yes wrangler@4 secret put WARTUNG 2>&1 | tail -n 3 | tee -a $LOG
          URL="https://preisvergleich.$SUB.workers.dev"
          echo "{\"url\": \"$URL\"}" > ../worker.json
          sleep 15
          log "Status: $(curl -s -m 30 $URL/status)"
          T0=$(date +%s); R=$(curl -s -m 120 -X POST -H "X-Wartung: $KEY" "$URL/suche?q=Fanta")
          log "Suche Fanta: $(( $(date +%s) - T0 )) s, $(echo "$R" | jq -c 'if type=="array" then {anzahl: length, erste: (.[0] // {} | {markt, produkt, preis_pro_liter})} else . end' 2>/dev/null || echo "$R" | head -c 400)"
          T0=$(date +%s); R=$(curl -s -m 300 -X POST -H "X-Wartung: $KEY" "$URL/aktualisieren")
          log "Aktualisieren: $(( $(date +%s) - T0 )) s, $(echo "$R" | head -c 600)"
          log "Angebote: $(curl -s -m 30 $URL/angebote.json | jq -c '{anzahl: length, gruppen: ([.[].gruppe] | unique), maerkte: ([.[].markt] | unique)}' 2>/dev/null)"
          log "Verlauf: $(curl -s -m 30 $URL/verlauf.csv | wc -l) Zeilen"
          openssl rand -hex 24 | npx --yes wrangler@4 secret put WARTUNG >/dev/null 2>&1 || true   # Testschlüssel wieder unbrauchbar machen
      - name: Ergebnis speichern
        if: always()
        run: |
          git config user.name "preisvergleich-bot"
          git config user.email "preisvergleich-bot@users.noreply.github.com"
          git add worker/deploy-log.txt worker.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "Worker hochgeladen" && git pull --rebase && git push; }
