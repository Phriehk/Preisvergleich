# Holt die aktuellen Preise von Marktguru und speichert sie im Repository.
name: Preise aktualisieren

# Der tägliche Lauf passiert jetzt beim Cloudflare Worker (worker/). Dieser Ablauf bleibt als Ersatz,
# den die App nur startet, wenn der Worker nicht erreichbar ist.
on:
  workflow_dispatch:       # erlaubt den manuellen Start (Knopf "Run workflow" oder aus der App)

permissions:
  contents: write          # nötig, damit die neuen Preise gespeichert werden dürfen

concurrency:
  group: preisvergleich    # Läufe nacheinander statt gleichzeitig
  cancel-in-progress: false

jobs:
  preise:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin    # damit Datumsangaben zur deutschen Zeit passen
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # geheimes Thema für Handy-Benachrichtigungen (siehe Anleitung)
      APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preise abfragen
        run: python test_marktguru.py
      - name: Ergebnis speichern
        run: |
          git config user.name "preisvergleich-bot"
          git config user.email "preisvergleich-bot@users.noreply.github.com"
          git add angebote.json verlauf.csv favoriten.json benachrichtigt.json
          git diff --cached --quiet || { git commit -m "Preise aktualisiert" && git pull --rebase && git push; }
      - name: Bei Fehler aufs Handy melden
        if: failure() && env.NTFY_TOPIC != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -H "Title: Preislauf fehlgeschlagen" -H "Tags: warning" -H "Click: $RUN_URL" \
            -d "Der taegliche Preislauf bei GitHub ist fehlgeschlagen. Tippen, um das Protokoll zu oeffnen." \
            "https://ntfy.sh/$NTFY_TOPIC"
