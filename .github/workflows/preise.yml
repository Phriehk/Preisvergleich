yaml
# Holt täglich die aktuellen Preise von Marktguru und speichert sie im Repository.
name: Preise aktualisieren

on:
  schedule:
    - cron: "0 5 * * *"   # täglich um 05:00 UTC (= 7 Uhr Sommerzeit / 6 Uhr Winterzeit)
  workflow_dispatch:       # erlaubt den manuellen Start über den Knopf "Run workflow"

permissions:
  contents: write          # nötig, damit die neuen Preise gespeichert werden dürfen

jobs:
  preise:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin    # damit Datumsangaben zur deutschen Zeit passen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preise abfragen
        run: python test_marktguru.py
      - name: Ergebnis speichern
        run: |
          git config user.name "preisvergleich-bot"
          git config user.email "preisvergleich-bot@users.noreply.github.com"
          git add angebote.json verlauf.csv favoriten.json
          git diff --cached --quiet || git commit -m "Preise aktualisiert"
          git push
