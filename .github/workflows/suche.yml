# Sucht ein beliebiges Getränk bei Marktguru (wird von der App am Handy gestartet).
name: Suche

on:
  workflow_dispatch:
    inputs:
      suchbegriff:
        description: "Getränk, z.B. Fanta"
        required: true
      ausschliessen:
        description: "Wörter zum Ausschließen, durch Komma getrennt"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: preisvergleich
  cancel-in-progress: false

jobs:
  suche:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
      SUCHE: ${{ inputs.suchbegriff }}
      AUS: ${{ inputs.ausschliessen }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Suchen
        run: python test_marktguru.py "--produkte=$SUCHE" "--ausschliessen=$AUS" --out=suche.json --kein-verlauf --ohne-favoriten
      - name: Ergebnis speichern
        run: |
          git config user.name "preisvergleich-bot"
          git config user.email "preisvergleich-bot@users.noreply.github.com"
          git add suche.json
          git diff --cached --quiet || { git commit -m "Suche" && git pull --rebase && git push; }
