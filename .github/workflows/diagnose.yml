# Einmalige Aktualisierung nach der Skript-Änderung (temporär, wird danach wieder gelöscht).
name: Einmalige Aktualisierung (temporär)

on:
  push:
    paths: [diagnose.py, .github/workflows/diagnose.yml]

permissions:
  contents: write

concurrency:
  group: preisvergleich
  cancel-in-progress: false

jobs:
  einmal:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python test_marktguru.py
      - run: |
          git config user.name "preisvergleich-bot"
          git config user.email "preisvergleich-bot@users.noreply.github.com"
          git add angebote.json verlauf.csv favoriten.json benachrichtigt.json
          git diff --cached --quiet || { git commit -m "Preise aktualisiert" && git pull --rebase && git push; }
