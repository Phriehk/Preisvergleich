name: Tests

on:
  push:
    paths: ["index.html", "worker/src/**", "tests/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

jobs:
  erkennung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/erkennung.test.mjs
