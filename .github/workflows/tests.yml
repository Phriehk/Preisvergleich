name: Tests

permissions:
  contents: write

on:
  push:
    paths: ["index.html", "worker/src/**", "tests/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

jobs:
  erkennung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/erkennung.test.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/alarm.test.mjs tests/zuordnung.test.mjs tests/push.test.mjs
      - name: Playwright und Chromium installieren
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Browser-Tests (echte Seite gegen den Worker-Code)
        run: |
          set -o pipefail
          node --test tests/browser/seite.test.mjs 2>&1 | tee browser.log
      - name: Bei Fehlern die Testausgabe ins Repository schreiben (die Logs sind von außen schwer lesbar)
        if: failure()
        run: |
          git config user.name "preisvergleich-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p tests/ergebnis && tail -n 150 browser.log > tests/ergebnis/browser.txt
          git add tests/ergebnis
          git diff --cached --quiet && exit 0
          git commit -m "Testausgabe Browser"
          git pull --rebase origin main
          git push
