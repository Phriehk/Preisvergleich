/* ---------- Strichcode scannen: Produkt erkennen (Open Food Facts) und als Favorit speichern ----------
   Chrome und Safari auf dem iPhone kennen keinen eingebauten Strichcode-Leser, dort wird ZXing beim ersten Scan nachgeladen. */
const ZXING="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/+esm";
const scan={stream:null,engine:null,lauf:0,ean:"",prod:null,treffer:[],marken:[],pt:null,pn:0};
let eanMerk=objekt(ls.get("pv-ean",{}));   // gescannte Nummern mit den gewählten Angaben (beim nächsten Scan gleich wieder da)
function eanOk(c){
  c=String(c||"").replace(/\D/g,"");if(![8,12,13].includes(c.length))return false;
  const d=c.split("").map(Number),pz=d.pop();let s=0;d.reverse().forEach((x,i)=>{s+=x*(i%2?1:3)});
  return (10-s%10)%10===pz;
}
async function scanEngine(){
  if(scan.engine)return scan.engine;
  if("BarcodeDetector" in window){
    try{
      const f=await BarcodeDetector.getSupportedFormats();
      if(f.includes("ean_13")){const d=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"].filter(x=>f.includes(x))});return scan.engine={detect:async v=>{const r=await d.detect(v);return r&&r[0]?r[0].rawValue:null}}}
    }catch(e){}
  }
  const Z=await import(ZXING);
  const hints=new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);
  hints.set(Z.DecodeHintType.TRY_HARDER,true);
  const leser=new Z.MultiFormatReader();leser.setHints(hints);
  const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
  return scan.engine={detect:async v=>{
    const w=v.videoWidth,h=v.videoHeight;if(!w||!h)return null;
    const sw=Math.round(w*.8),sh=Math.round(h*.45),f=Math.min(1,900/sw),cw=Math.max(1,Math.round(sw*f)),ch=Math.max(1,Math.round(sh*f));   // nur der Rahmen in der Mitte
    cv.width=cw;cv.height=ch;cx.drawImage(v,(w-sw)/2,(h-sh)/2,sw,sh,0,0,cw,ch);
    const px=cx.getImageData(0,0,cw,ch).data,grau=new Uint8ClampedArray(cw*ch);
    for(let i=0,j=0;j<grau.length;i+=4,j++)grau[j]=(px[i]*77+px[i+1]*150+px[i+2]*29)>>8;
    try{return leser.decodeWithState(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.RGBLuminanceSource(grau,cw,ch)))).getText()}catch(e){return null}
  }};
}
const sStatus=(t,fehler)=>{const e=$("sStatus");e.textContent=t;e.style.color=fehler?"var(--warn)":""};
function kameraStop(){scan.lauf++;if(scan.stream){scan.stream.getTracks().forEach(t=>t.stop());scan.stream=null}const v=$("sVideo");if(v)v.srcObject=null}
async function kameraStart(){
  kameraStop();const nr=scan.lauf;
  $("sKamera").hidden=false;$("sErgebnis").hidden=true;$("sEan").value="";
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$("sKamera").hidden=true;sStatus("Die Kamera ist hier nicht verfügbar. Gib die Nummer unter dem Strichcode ein.",true);return}
  sStatus("Kamera wird gestartet …");
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}});
    if(nr!==scan.lauf){st.getTracks().forEach(t=>t.stop());return}
    scan.stream=st;const v=$("sVideo");v.srcObject=st;await v.play().catch(()=>{});
    sStatus("Strichcode waagerecht in den Rahmen halten …");
    const eng=await scanEngine();
    scan.pt=null;scan.pn=0;
    const runde=async()=>{
      if(nr!==scan.lauf)return;
      let c=null;try{c=await eng.detect(v)}catch(e){}
      c=c&&String(c).replace(/\D/g,"");
      if(c&&eanOk(c)){
        if(c===scan.pt)scan.pn++;else{scan.pt=c;scan.pn=1}
        if(scan.pn>=2||!("BarcodeDetector" in window)){kameraStop();if(navigator.vibrate)navigator.vibrate(60);eanSuchen(c);return}
      }
      setTimeout(runde,120);
    };
    runde();
  }catch(e){
    $("sKamera").hidden=true;kameraStop();
    sStatus(e&&e.name==="NotAllowedError"?"Kein Zugriff auf die Kamera. Erlaube sie für diese Seite (in Chrome auf dem iPhone: Einstellungen › Chrome › Kamera) oder gib die Nummer unter dem Strichcode ein.":e&&/import|module|fetch/i.test(e.message||"")?"Der Strichcode-Leser konnte nicht geladen werden (Internet?). Gib die Nummer unter dem Strichcode ein.":"Die Kamera ließ sich nicht starten. Gib die Nummer unter dem Strichcode ein.",true);
  }
}

async function produktVonEan(ean){
  const felder="product_name,product_name_de,generic_name_de,generic_name,brands,quantity,image_front_small_url,image_small_url";
  for(const basis of ["https://world.openfoodfacts.org","https://world.openbeautyfacts.org","https://world.openproductsfacts.org"]){
    try{
      const r=await fetch(basis+"/api/v2/product/"+ean+".json?fields="+felder);if(!r.ok)continue;
      const j=await r.json();if(j&&j.status===1&&j.product)return j.product;
    }catch(e){}
  }
  return null;
}
// Vorschlag für den Artikel: das erste richtige Wort des Produktnamens ohne Marke und Mengenangaben
function scanWoerter(name,marke){
  const mk=new Set([nurK(marke),...String(marke||"").split(/[\s-]+/).map(nurK)].filter(Boolean)),gesehen=new Set();
  const w=String(name||"").replace(/\d+[.,]?\d*\s*(%|g|kg|ml|l|cl|stk|stück)\b/gi," ").split(/[\s,;/()|+]+/).map(w=>w.replace(/^[-.]+|[-.]+$/g,"")).filter(w=>{const k=nurK(w);if(w.length<3||/^\d/.test(w)||mk.has(k)||gesehen.has(k))return false;gesehen.add(k);return true}).slice(0,8);
  // Eigenschaften („Irische“, „Zero“, „Classic“) nach hinten, damit der Vorschlag möglichst das Produkt selbst ist („Butter“)
  const beiwort=x=>/(isch|lich|ig)(e[rsn]?)?$/i.test(x)||/^(zero|light|classic|original|bio|extra|fein|frisch|natur|sugar|free|plus|mini|maxi|family|sensitive|mild|zart|feine?s?)$/i.test(nurK(x));
  return [...w.filter(x=>!beiwort(x)),...w.filter(beiwort)];
}
async function eanSuchen(ean){
  ean=String(ean||"").replace(/\D/g,"");
  if(!eanOk(ean)){sStatus("Die Nummer stimmt nicht. Sie hat 8 oder 13 Ziffern und steht unter dem Strichcode.",true);return}
  kameraStop();$("sKamera").hidden=true;scan.ean=ean;scan.treffer=[];scan.marken=[];
  sStatus("Nummer "+ean+": Produkt wird gesucht …");

  scan.prod=p;
  const merk=eanMerk[ean],name=p?(p.product_name_de||p.product_name||p.generic_name_de||p.generic_name||"").trim():"";
  const marke=merk?merk.marke:p?String(p.brands||"").split(",")[0].trim():"";
  const woerter=scanWoerter(name+" "+(p&&p.generic_name_de||""),marke);
  const artikel=merk?merk.artikel:woerter[0]||"";
  sStatus(p?"Gefunden. Prüfe Marke und Artikel, dann speichern.":"Dieses Produkt kennt die freie Datenbank noch nicht. Trag Marke und Artikel selbst ein.");
  const bild=p&&(p.image_front_small_url||p.image_small_url)||"";
  $("sErgebnis").innerHTML=`${p?`<div class="scan-produkt">${/^https:\/\//.test(bild)?`<img src="${esc(bild)}" alt="" referrerpolicy="no-referrer">`:""}<div><b>${esc(name||"Ohne Namen")}</b><small>${esc([String(p.brands||"").split(",")[0].trim(),p.quantity].filter(Boolean).join(" · "))}</small></div></div>`:""}
    <div class="reihe"><label>Marke (leer = alle Marken)<input class="feld" id="sMarke" maxlength="40" autocomplete="off" value="${esc(marke)}"></label><label>Artikel, z. B. Deo, Milch, Cola<input class="feld" id="sArtikel" maxlength="40" autocomplete="off" value="${esc(artikel)}"></label></div>
    ${woerter.length>1?`<div class="chips">${woerter.map(w=>`<button type="button" class="chip" data-sw="${esc(w)}">${esc(w)}</button>`).join("")}</div>`:""}

    <div class="reihe"><button type="button" class="knopf haupt" id="sSpeichern">☆ Als Favorit speichern</button><button type="button" class="knopf" id="sWeiter">📷 Nächstes scannen</button></div>`;
  $("sErgebnis").hidden=false;
  scanPruefen();
}

}

function listeUmschalten(k){
  if(zettel[k]>0||(zk(k).ml===0&&aufListe(k)))vonListe(zk(k).g);
  else aufListeSetzen(k);
  listeSpeichern();render();
}
const AKTION={
  suchen:()=>sucheStarten(),
  scannen:()=>scanOeffnen(),
  sucheLeeren:()=>{S.suche.items=[];S.suche.text="";render()},
  alleAufListe:()=>sucheHinzu(S.suche.items.filter(it=>it.status==="fertig"&&it.roh.length&&!aufListe(it.name)).map(alleMarken)),
  favNeu:async()=>{try{await favsSpeichern([...favs(),{name:S.p,aus:"",nur:S.d.marke?[S.d.marke]:[]}]);melde("„"+S.p+"“ ist jetzt ein Favorit.")}catch(e){melde(netzFehler(e),true)}render()},
  favWeg:async()=>{
    if(!S.d.weg){S.d.weg=true;render();setTimeout(()=>{if(S.d.weg){S.d.weg=false;render()}},5000);return}
    S.d.weg=false;
    try{await favsSpeichern(favs().filter(f=>f.name!==S.p));melde("„"+S.p+"“ ist kein Favorit mehr. Der Preisverlauf bleibt erhalten.")}catch(e){melde(netzFehler(e),true)}
    render();
  },
  pListe:(b)=>{const k=b.dataset.k;if(aufListe(S.p)){vonListe(S.p)}else aufListeSetzen(k);listeSpeichern();render()},
  korrReset:()=>{offers.filter(o=>grp(o)===S.p).forEach(o=>delete korr[o.k]);eFertig()},
  alarmListe:()=>{const n=listeFavNamen().filter(x=>!(favVon(x)||{}).alarm);alarmSetzen(n,f=>({wert:JEDES,einheit:alarmEinheiten(artG(f.name))[0][0],ml:null}));render()},
  alarmAlleAus:()=>{alarmSetzen(favs().map(f=>f.name),()=>null);render()},
  alteWeg:()=>{Object.keys(zettel).filter(k=>veraltet(k)).forEach(k=>delete zettel[k]);listeSpeichern();render()},
  extraLeeren:()=>{extra.forEach(n=>delete haken["+|"+n]);extra=[];listeSpeichern();render()},
  schnellSuchen:()=>{const t=String(S.form.schnell||"").trim();if(!t)return;S.form.schnell="";S.suche.text=t;zeige("suchen");sucheStarten()},
  schnellNotieren:()=>{const t=String(S.form.schnell||"").replace(/\s+/g," ").trim().slice(0,40);if(!t)return;if(!extra.some(x=>x.toLowerCase()===t.toLowerCase()))extra.push(t);S.form.schnell="";listeSpeichern();render()},
  extraHinzu:()=>{const t=String(S.form.extraName||"").replace(/\s+/g," ").trim().slice(0,40);if(!t)return;if(!extra.some(x=>x.toLowerCase()===t.toLowerCase())&&extra.length<100)extra.push(t);S.form.extraName="";listeSpeichern();render();const f=$("extraName");if(f)f.focus()},
  abgehakteWeg:()=>{
    let n=0;
    expGruppen().forEach(g=>g.namen.forEach(x=>{if(!haken[x.k])return;n++;if(x.eigen)extra=extra.filter(e=>e!==x.name);else if(x.z)zMitglieder(x.z).forEach(m=>delete zettel[m]);delete haken[x.k]}));
    listeSpeichern();melde(n+" Artikel von der Liste genommen.");render();
  },
  hakenNull:()=>{haken={};listeSpeichern();render()},
  kopieren:()=>{
    const t=exportText(),ta=$("expText");
    const fertig=()=>melde("Liste kopiert.");
    (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t).then(fertig):Promise.reject()).catch(()=>{try{ta.focus();ta.select();document.execCommand("copy");fertig()}catch(x){melde("Kopieren ging nicht. Markiere den Text und kopiere ihn selbst.",true)}});
  },
  teilen:()=>{navigator.share({title:"Einkaufsliste",text:exportText()}).catch(()=>{})},
  kurzbefehl:()=>{const n=String(S.form.kurzName??kurzName).trim()||kurzName;kurzName=n;ls.setRaw("pv-kurz",n);location.href="shortcuts://run-shortcut?name="+encodeURIComponent(n)+"&input=text&text="+encodeURIComponent(exportText())},
  ortSpeichern,ortGps,
  ortWeg:()=>{S.form.ortInfo="Standort entfernt.";S.form.ortText="";ortSetzen(null)},
  kontoLos,
  kontoCode:()=>{S.kMode="code";S.kInfo="";render()},
  abmelden:async()=>{try{await kFetch("/konto/logout","POST",{},konto.token)}catch(e){}kontoMerken(null);S.kMode="login";S.kInfo="Abgemeldet.";render()},
  loeschenFragen:()=>{S.form.loeschen=true;S.kInfo="";render()},
  loeschenAbbrechen:()=>{S.form.loeschen=false;delete S.form.kLoeschPw;render()},
  kontoLoeschen:async()=>{
    const pw=S.form.kLoeschPw||"";if(!pw){S.kInfo="Bitte dein Passwort eingeben.";render();return}
    try{await kFetch("/konto/loeschen","POST",{dk:await dkVon(konto.name,pw)},konto.token);kontoMerken(null);S.form.loeschen=false;delete S.form.kLoeschPw;S.kMode="login";S.kInfo="Das Konto und seine Daten sind gelöscht."}
    catch(e){S.kInfo=netzFehler(e)}
    render();
  },
  codeSpeichern:async()=>{
    const c=String(S.form.code||"").trim();if(!c)return;
    zugang=c;ls.setRaw("pv-code",c);delete S.form.code;
    try{await (await wf("/favoriten.json")).json();await favsLaden();await korrLaden();await angeboteLaden();await standLaden();verlaufLaden();anfragenLaden();melde("Zugangscode gespeichert.")}
    catch(e){melde(netzFehler(e),true)}
    render();
  },
  codeWeg:async()=>{zugang="";ls.setRaw("pv-code",null);S.anfragen=null;try{await angeboteLaden()}catch(e){}render()},
  aktualisieren:()=>serverAktualisieren(false),
  pushAn:()=>pushAn(),pushAus:()=>pushAus(),pushTest:()=>pushTest(),
  mkNeu:()=>{const m=mkAktuell();delete S.mk.versucht["liste:"+quellPlz()];if(m){delete S.mk.versucht[mkKey(m)];delete S.mk.daten[mkKey(m)]}render()}
};
$("ansicht").addEventListener("click",e=>{
  const t=e.target;let b;
  if(b=t.closest("a[data-tz]")){e.preventDefault();zeige("treffer",b.dataset.tz);return}
  if(b=t.closest("[data-tw]")){   // Treffer der Suche: in diesem Markt kaufen
    const z=trefferZeilen[+b.dataset.tw],a=z&&karteAkt(z.i,z.j,true);if(!a)return;
    const setzen=()=>{Object.keys(zettel).filter(k=>zettel[k]>0&&zk(k).g===a.name).forEach(k=>{wahl[k]=z.m});listeSpeichern();render()};
    if(istFav(a.name)&&aufListe(a.name)){
      if(wahlName(a.name)===z.m){vonListe(a.name);listeSpeichern();render();return}
      setzen();melde("„"+a.name+"“ kaufst du jetzt bei "+z.m+".");return;
    }
    sucheHinzu([a]).then(()=>{if(aufListe(a.name)){setzen();melde("„"+a.name+"“ steht auf der Liste, gekauft bei "+z.m+".")}});
    return;
  }
  if(b=t.closest("[data-wahlweg]")){const g=b.dataset.wahlweg;Object.keys(wahl).filter(k=>zk(k).g===g).forEach(k=>delete wahl[k]);listeSpeichern();render();return}
  if(b=t.closest("a[data-zp]")){e.preventDefault();const x=zk(b.dataset.zp);zeige("produkt",x.g);if(x.ml){S.d.ml=String(x.ml);render()}return}
  if(b=t.closest("[data-go]")){zeige(b.dataset.go);return}
  if(b=t.closest("[data-liste]")){e.stopPropagation();listeUmschalten(b.dataset.liste);return}
  if(b=t.closest("[data-seg]")){
    const n=b.dataset.seg,w=b.dataset.wert;
    if(n==="sort")S.sort=w;
    else if(n==="zeit")S.d.zeit=w;
    else if(n==="sort2"){S.d.dir=S.d.sort===w?-(S.d.dir||1):1;S.d.sort=w}
    else if(n==="lzeit")S.lzeit=w;
    else if(n==="tour"){tourArt=w;ls.setRaw("pv-tour",w)}
    else if(n==="theme"){theme=w;ls.setRaw("pv-theme",w);themeSetzen()}
    else if(n==="kMode"){S.kMode=w;S.kInfo=""}
    else if(n==="aTab"){zeige(w);return}
    else if(n==="mkZeit")S.mk.zeit=w;
    else if(n==="mkBereich")S.mk.bereich=w;
    render();return;
  }
  if(b=t.closest("[data-sort]")){const k=b.dataset.sort;S.d.dir=S.d.sort===k?-(S.d.dir||1):1;S.d.sort=k;render();return}
  if(b=t.closest("[data-marke]")){S.d.marke=b.dataset.marke;render();return}
  if(b=t.closest("[data-al-modus]")){
    const g=b.dataset.alModus,jedes=b.dataset.wert==="jedes";
    alarmSetzen([g],f=>{const al=f.alarm||{einheit:alarmEinheiten(artG(g))[0][0],ml:null};if(jedes)return {...al,wert:JEDES};const gi=gruppenInfo(g);return {...al,wert:al.wert<JEDES?al.wert:(gi.b?Math.max(0.01,Math.floor(gp(gi.b)*90)/100):1)}});
    render();return;
  }
  if(b=t.closest("[data-mk]")){S.mk.id=b.dataset.mk;ls.setRaw("pv-markt",S.mk.id);render();return}
  if(b=t.closest("[data-mkf]")){
    const o=mkZeilen[+b.dataset.mkf];if(!o)return;const label=favLabel(o);
    if(istFav(label)){zeige("produkt",label);return}
    if(o.liter>0&&ARTEN[o.art])sucheHinzu([mkAkt(o,false)]);else melde("Zu diesem Angebot fehlt die Menge, deshalb lässt es sich nicht als Favorit vergleichen.",true);
    return;
  }
  if(b=t.closest("[data-mkl]")){
    const o=mkZeilen[+b.dataset.mkl];if(!o)return;const label=favLabel(o),x=label.slice(0,40);
    if(istFav(label)&&aufListe(label)){vonListe(label);listeSpeichern();render();return}
    if(extra.includes(x)){extra=extra.filter(y=>y!==x);delete haken["+|"+x];listeSpeichern();render();return}
    if(o.liter>0&&ARTEN[o.art]){sucheHinzu([mkAkt(o,true)]);return}
    extra.push(x);listeSpeichern();melde("„"+x+"“ steht auf der Liste unter „Sonstiges“.");render();return;
  }
  if(b=t.closest("[data-korr]")){const o=zeilenListe[+b.dataset.korr];if(o)editOeffnen(o);return}
  if(b=t.closest("[data-schritt]")){
    const k=b.dataset.k,r=zRef(k),a=ARTEN[artG(zk(k).g)],schritt=r||a.step,v=r?Math.round(Math.max(0,Math.round((zettel[k]||0)/r)+(+b.dataset.schritt))*r*1e4)/1e4:Math.round(((zettel[k]||0)+(+b.dataset.schritt)*schritt)*1000)/1000;
    if(v>=(r||a.min)-1e-9&&v<=500){zMitglieder(k).forEach(m=>{zettel[m]=v});listeSpeichern();render()}
    return;
  }
  if(b=t.closest("[data-zx]")){zMitglieder(b.dataset.zx).forEach(m=>delete zettel[m]);listeSpeichern();render();return}
  if(b=t.closest("[data-xdel]")){const n=b.dataset.xdel;extra=extra.filter(x=>x!==n);delete haken["+|"+n];listeSpeichern();render();return}
  if(b=t.closest("[data-code-fuer]")){
    const name=b.dataset.codeFuer;
    wf("/konto/code",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})}).then(r=>r.json()).then(j=>{S.form.codeInfo=`Code für <b>${esc(name)}</b>: <b style="font-size:1.3rem;letter-spacing:.12em">${esc(j.code)}</b><br>Gültig: ${esc(j.gueltig)}. Gib ihn der Person weiter, am besten nicht öffentlich.`;render()}).catch(err=>melde(netzFehler(err),true));
    return;
  }
  // Suche: Kacheln
  const I=S.suche;
  if(b=t.closest("[data-mein]")){meintest(+b.dataset.mein,b.dataset.wort);return}
  if(b=t.closest("[data-ia]")){const it=I.items[+b.dataset.ia];if(it){if(istFav(it.name)&&aufListe(it.name)){vonListe(it.name);listeSpeichern();render()}else sucheHinzu([alleMarken(it)])}return}
  if(b=t.closest("[data-ik]")){const [i,j]=b.dataset.ik.split("|").map(Number),a=karteAkt(i,j,false);if(a)sucheHinzu([a]);return}
  if(b=t.closest("[data-il]")){const [i,j]=b.dataset.il.split("|").map(Number),a=karteAkt(i,j,true);if(a){if(istFav(a.name)&&aufListe(a.name)){vonListe(a.name);listeSpeichern();render()}else sucheHinzu([a])}return}
  if(b=t.closest("[data-if]")){const n=b.dataset.if;if(aufListe(n))vonListe(n);else aufListeSetzen(n,mengeUmrechnen((I.items[+b.dataset.i]||{}).menge,artG(n)));listeSpeichern();render();return}
  if(b=t.closest("[data-io]")){
    const it=I.items[+b.dataset.io];if(!it)return;
    const fn=freiName(it);
    if(aufListe(fn)&&frei[fn]){vonListe(fn);listeSpeichern();render();return}
    frei[fn]=it.einheit||"st";sucheHinzu([{name:fn,entries:[],nur:[],menge:it.menge,liste:true,frei:true}]);return;
  }
  if(b=t.closest("[data-aktion]")){const f=AKTION[b.dataset.aktion];if(f)f(b);return}
  if(b=t.closest("[data-p]")){zeige("produkt",b.dataset.p);return}
});
$("ansicht").addEventListener("keydown",e=>{
  const t=e.target;
  if(e.key==="Enter"&&t.matches("article[data-p]")){zeige("produkt",t.dataset.p);return}
  if(e.key==="Enter"&&!e.shiftKey&&t.id==="sucheText"&&!t.value.includes("\n")){e.preventDefault();S.suche.text=t.value;sucheStarten();return}
  if(e.key==="Enter"&&t.dataset.alWert){e.preventDefault();t.blur();return}
  if(e.key==="Enter"&&t.tagName==="INPUT"){
    const ziel={extraName:"extraHinzu",schnell:"schnellSuchen",ortText:"ortSpeichern",kmFeld:"ortSpeichern",kName:"kontoLos",kPw:"kontoLos",kPw2:"kontoLos",kCode:"kontoLos",codeFeld:"codeSpeichern",kLoeschPw:"kontoLoeschen"}[t.id];
    if(ziel){e.preventDefault();AKTION[ziel]()}
  }
});
$("ansicht").addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="sucheText"){S.suche.text=t.value;return}
  if(t.id==="filterText"){S.filter=t.value;render();return}
  if(t.id==="mkSuche"){S.mk.q=t.value;render();return}
  if(t.dataset.f){S.form[t.dataset.f]=t.type==="checkbox"?t.checked:t.value;return}
});
$("ansicht").addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.d){S.d[t.dataset.d]=t.type==="checkbox"?t.checked:t.value;render();return}
  if(t.dataset.f){S.form[t.dataset.f]=t.type==="checkbox"?t.checked:t.value;if(t.tagName==="SELECT"||t.type==="checkbox")render();return}
  if(t.dataset.wahl!==undefined&&t.matches("[data-wahl]")){
    const k=t.dataset.wahl;zMitglieder(k).forEach(m=>delete wahl[m]);if(t.value)wahl[k]=t.value;else delete wahl[k];
    listeSpeichern();render();return;
  }
  if(t.matches("[data-push-ntfy]")){pushNtfy(t.checked);return}
  if(t.dataset.segSel){const n=t.dataset.segSel;if(n==="plan")S.plan=+t.value||0;else S[n]=t.value;render();return}
  if(t.dataset.alAn){const g=t.dataset.alAn;alarmSetzen([g],f=>t.checked?(f.alarm||{wert:JEDES,einheit:alarmEinheiten(artG(g))[0][0],ml:null}):null);render();return}
  if(t.dataset.alWert){const g=t.dataset.alWert,v=parseFloat(String(t.value).replace(",","."));if(v>0&&v<JEDES)alarmSetzen([g],f=>({...f.alarm,wert:Math.round(v*100)/100}));else melde("Bitte einen Wunschpreis über 0 eingeben, zum Beispiel 0,80.",true);render();return}
  if(t.dataset.alEinheit){const g=t.dataset.alEinheit;alarmSetzen([g],f=>({...f.alarm,einheit:t.value}));render();return}
  if(t.dataset.alMl!==undefined&&t.matches("[data-al-ml]")){const g=t.dataset.alMl;alarmSetzen([g],f=>({...f.alarm,ml:t.value?+t.value:null}));render();return}
  if(t.dataset.hk){if(t.checked)haken[t.dataset.hk]=1;else delete haken[t.dataset.hk];listeSpeichern();render();return}
  if(t.dataset.ie!==undefined){const it=S.suche.items[+t.dataset.ie];if(it)it.einheit=t.value;return}
  if(t.dataset.markt){const m=t.dataset.markt;t.checked?aus.delete(m):aus.add(m);ls.set("pv-aus",[...aus]);kontoSync();render();return}
  if(t.dataset.aktionChange==="erledigtAus"){S.erledigtAus=t.checked;ls.setRaw("pv-erledigt",t.checked?"aus":null);render();return}
  if(t.dataset.aktionChange==="app"){appPreise=t.checked;ls.setRaw("pv-app",t.checked?"1":null);render();return}
  if(t.dataset.l){
    let v=parseFloat(String(t.value).replace(",","."));const rf=parseFloat(t.dataset.ref);
    if(rf>0)v=Math.round(Math.max(1,Math.round(v))*rf*1e4)/1e4;   // ganze Stück
    if(v>0&&v<=500)zMitglieder(t.dataset.l).forEach(m=>{zettel[m]=v});
    listeSpeichern();render();return;
  }
  if(t.dataset.r){
    let v=parseFloat(String(t.value).replace(",","."));const rf=parseFloat(t.dataset.ref);
    if(rf>0)v=v/rf;   // Eingabe je Stück, gespeichert je kg bzw. Liter
    zMitglieder(t.dataset.r).forEach(m=>{delete richt[zk(m).g]});
    if(v>0&&v<=1000)richt[zk(t.dataset.r).g]=Math.round(v*10000)/10000;
    listeSpeichern();render();return;
  }
});
$("ansicht").addEventListener("toggle",e=>{
  const d=e.target;if(!d.dataset||!d.dataset.merk)return;
  const vorher=!!S.form[d.dataset.merk];S.form[d.dataset.merk]=d.open;
  if(d.dataset.merk.startsWith("mk:")&&vorher!==d.open)render();   // Angebote einer Gruppe erst beim Aufklappen zeichnen
},true);

function themeSetzen(){const r=document.documentElement;if(theme==="dark"||theme==="light")r.setAttribute("data-theme",theme);else r.removeAttribute("data-theme")}
themeSetzen();

/* ---------- Start ---------- */
(async function start(){
  let impText="";
  try{
    const mi=location.hash.match(/import=([^&]*)/);if(mi)impText=decodeURIComponent(mi[1].replace(/\+/g," "));
    const mc=location.hash.match(/code=([A-Za-z0-9]+)/);if(mc){zugang=mc[1];ls.setRaw("pv-code",zugang)}
  }catch(e){}
  if(impText){S.suche.text=impText;S.v="suchen";try{history.replaceState({v:"suchen",p:null},"",location.pathname+"#suchen")}catch(e){}}
  else{const s=ausHash();S.v=s.v;S.p=s.p;if(S.v==="produkt"&&!S.p)S.v="angebote";try{history.replaceState({v:S.v,p:S.p},"",hashVon(S.v,S.p))}catch(e){}}
  render();
  try{
    stand=(await (await wf("/status")).json()).stand||null;   // ist der Server erreichbar?
    await favsLaden();
    await kontoLaden(true);
    await korrLaden();
    await angeboteLaden();
    online=true;
  }catch(e){
    if(window.PV_BEISPIEL&&!offers.length){demo=true;roh=window.PV_BEISPIEL;favsLokal=[...new Set(roh.map(x=>x.gruppe))].map(name=>({name,aus:""}));neuAufbereiten()}
    else if(offers.length)melde("Keine Verbindung zum Server. Du siehst die zuletzt geladenen Angebote.",true);
  }
  mengenRunden();render();
  if(impText)sucheStarten();
  if(online){verlaufLaden().then(render);distLaden();if(S.v==="mehr"&&betreiber())anfragenLaden()}
  if(cf&&"serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
    // Tipp auf eine Mitteilung bei offener App: dorthin wechseln (z. B. zum Artikel)
    navigator.serviceWorker.addEventListener("message",e=>{const d=e.data||{};if(d.typ==="oeffnen"&&d.url){try{const u=new URL(d.url);if(u.hash&&u.hash!==location.hash)location.hash=u.hash}catch(x){}}});
  }
})();
</script>
