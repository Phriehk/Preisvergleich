<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preisvergleich</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script>try{var t=localStorage.getItem("pv-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="theme-color" content="#c8102e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Preise">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Aufbau: Kopfzeile, Inhalt in einer Spalte; Navigation unten (Handy) bzw. links (ab 900 px). Preise im Stil des Grundpreis-Etiketts am Regal. */
:root{
  --bg:#f2f1ec;--flaeche:#fff;--weich:#f7f6f2;--tinte:#1b1f23;--grau:#5b6268;--linie:#e1ded4;
  --rot:#c8102e;--rot-weich:#fbe6e9;--gruen:#1b7a4b;--gruen-weich:#e3f2e9;--gelb:#ffd23f;--gelb-tinte:#3a2e00;--warn:#a2560a;--warn-weich:#fbefe1;
  --schatten:0 1px 2px rgba(30,30,10,.06),0 6px 18px rgba(30,30,10,.05);
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--f-text:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;--leiste-h:62px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111316;--flaeche:#1b1e22;--weich:#16191c;--tinte:#f1efe6;--grau:#a3a8ad;--linie:#2d3135;--rot:#ff5a6e;--rot-weich:#3a1c22;--gruen:#6fd49b;--gruen-weich:#15301f;--gelb:#e8b923;--gelb-tinte:#1c1600;--warn:#ffb454;--warn-weich:#33260f;--schatten:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111316;--flaeche:#1b1e22;--weich:#16191c;--tinte:#f1efe6;--grau:#a3a8ad;--linie:#2d3135;--rot:#ff5a6e;--rot-weich:#3a1c22;--gruen:#6fd49b;--gruen-weich:#15301f;--gelb:#e8b923;--gelb-tinte:#1c1600;--warn:#ffb454;--warn-weich:#33260f;--schatten:none;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--tinte);font:16px/1.5 var(--f-text);-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
[hidden]{display:none!important}
a{color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rot);outline-offset:2px}

/* ---------- Grundbausteine ---------- */
.knopf{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border:1px solid var(--linie);border-radius:10px;background:var(--flaeche);cursor:pointer;white-space:nowrap;text-decoration:none}
.knopf:hover{border-color:var(--grau)}
.knopf:disabled{opacity:.5;cursor:default}
.knopf.haupt{background:var(--tinte);color:var(--bg);border-color:var(--tinte);font-weight:600}
.knopf.klein{min-height:32px;padding:0 10px;font-size:.88rem;border-radius:8px}
.knopf.an{background:var(--gruen-weich);border-color:var(--gruen);color:var(--tinte)}
.knopf.leise{border-color:transparent;background:transparent;color:var(--grau)}
.knopf.leise:hover{background:var(--flaeche);border-color:var(--linie)}
.feld,select.feld,textarea.feld{min-height:40px;padding:8px 12px;border:1px solid var(--linie);border-radius:10px;background:var(--flaeche);min-width:0}
textarea.feld{width:100%;resize:vertical;line-height:1.4}
.reihe{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.reihe>.wachsen{flex:1 1 200px}
.karte-box{background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);box-shadow:var(--schatten);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box-kopf{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.box-kopf h2{font:700 1.3rem/1.1 var(--f-display);letter-spacing:.01em}
.box-kopf .rechts{margin-left:auto;color:var(--grau);font-size:.9rem}
.leise-text{color:var(--grau);font-size:.9rem}
.klein-text{font-size:.82rem;color:var(--grau)}
.leer{padding:28px 16px;text-align:center;color:var(--grau);display:flex;flex-direction:column;gap:10px;align-items:center}
.leer b{color:var(--tinte);font:700 1.25rem var(--f-display)}
.segment{display:inline-flex;padding:3px;gap:2px;background:var(--weich);border:1px solid var(--linie);border-radius:11px;max-width:100%;flex-wrap:wrap}
.segment button{min-height:32px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--grau);cursor:pointer}
.segment button.an{background:var(--flaeche);color:var(--tinte);font-weight:600;box-shadow:var(--schatten)}
.segment button:disabled{opacity:.45;cursor:default}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:6px;font-size:.78rem;font-weight:600;background:var(--weich);border:1px solid var(--linie);color:var(--grau);white-space:nowrap}
.tag.gelb{background:var(--gelb);border-color:var(--gelb);color:var(--gelb-tinte)}
.tag.gruen{background:var(--gruen-weich);border-color:transparent;color:var(--gruen)}
.tag.rot{background:var(--rot-weich);border-color:transparent;color:var(--rot)}
.tag.warn{background:var(--warn-weich);border-color:transparent;color:var(--warn)}
.mb{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0;flex:none}
.km{color:var(--grau);font-size:.85rem;white-space:nowrap}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--grau)}
details[open]>summary::before{content:"▾ "}
.bild{position:relative;flex:none;width:56px;height:56px;border-radius:10px;background:#fff;border:1px solid var(--linie);overflow:hidden;display:grid;place-items:center}
.bild img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.bild .ph{font:700 1.3rem var(--f-display);color:#8a8f94}

/* ---------- Kopf und Navigation ---------- */
.kopf{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--linie);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.kopf-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{flex:none;width:38px;height:38px;border-radius:10px;background:var(--rot);color:#fff;display:grid;place-items:center;font:700 .95rem/1 var(--f-display);letter-spacing:.02em}
.kopf h1{font:700 1.55rem/1.05 var(--f-display)}
.kopf .sub{margin:0;color:var(--grau);font-size:.82rem;line-height:1.2}
.kopf-t{min-width:0;flex:1}
.kopf-t h1,.kopf .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rund{flex:none;width:40px;height:40px;padding:0;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--grau);cursor:pointer;display:grid;place-items:center}
.rund:hover{background:var(--flaeche);border-color:var(--linie)}
.rund svg{width:22px;height:22px}
.rund.dreht svg{animation:drehen 1s linear infinite}
@keyframes drehen{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.rund.dreht svg{animation:none}}
.leiste{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:space-around;background:var(--flaeche);border-top:1px solid var(--linie);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.leiste button{position:relative;flex:1;min-width:0;height:var(--leiste-h);border:0;background:transparent;color:var(--grau);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;font-weight:500;cursor:pointer}
.leiste button svg{width:24px;height:24px}
.leiste button.an{color:var(--rot);font-weight:600}
.leiste .zahl{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rot);color:#fff;font:600 .7rem/18px var(--f-text);text-align:center}
.ansicht{max-width:1100px;margin:0 auto;padding-block:14px calc(var(--leiste-h) + 28px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:900px){
  .ansicht{max-width:1180px}
  .kopf-in{max-width:none}
  body{display:grid;grid-template-columns:200px minmax(0,1fr);grid-template-rows:auto 1fr}
  .kopf{grid-column:1/-1}
  .leiste{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);align-self:start;flex-direction:column;justify-content:flex-start;gap:2px;border:0;background:transparent;padding:14px 0 0 max(16px,env(safe-area-inset-left,0px))}
  .leiste button{flex:none;height:44px;flex-direction:row;justify-content:flex-start;gap:10px;padding:0 12px;border-radius:10px;font-size:.98rem}
  .leiste button.an{background:var(--flaeche);box-shadow:var(--schatten)}
  .leiste button svg{width:20px;height:20px}
  .leiste .zahl{position:static;margin-left:auto}
  .ansicht{padding-bottom:40px;margin:0;width:100%}
}

/* ---------- Hinweise ---------- */
.status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.88rem;color:var(--grau)}
.status .punkt{width:8px;height:8px;border-radius:50%;background:var(--gruen);flex:none}
.banner{border-radius:12px;padding:10px 14px;font-size:.92rem;background:var(--weich);border:1px solid var(--linie)}
.banner.warn{background:var(--warn-weich);border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--tinte)}
.banner.rot{background:var(--rot);border-color:var(--rot);color:#fff;font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--leiste-h) + env(safe-area-inset-bottom,0px) + 12px);z-index:40;max-width:min(560px,calc(100% - 32px));padding:10px 14px;border-radius:12px;background:var(--tinte);color:var(--bg);box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:.92rem;display:flex;gap:10px;align-items:center}
.toast.fehler{background:var(--rot);color:#fff}
.toast button{border:0;background:transparent;color:inherit;font-size:1.1rem;cursor:pointer;padding:0 2px}
@media (min-width:900px){.toast{bottom:20px}}

/* ---------- Angebote (Übersicht) ---------- */
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.produkt{position:relative;display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);box-shadow:var(--schatten);cursor:pointer;min-width:0}
.produkt:hover{border-color:var(--grau)}
.produkt.ziel{border-color:var(--gruen);box-shadow:0 0 0 1px var(--gruen)}
.produkt.ohne{opacity:.72}
.p-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.p-text h3{font:600 1.02rem/1.25 var(--f-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:40px}
.preisschild{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.preisschild b{font:700 2rem/1 var(--f-display);color:var(--gruen)}
.preisschild .je{font-size:.9rem;color:var(--grau)}
.p-info{font-size:.86rem;color:var(--grau);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.p-zeile{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap}
.p-zeile .p-tags{margin-top:0}
.p-plus{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:1px solid var(--linie);background:var(--flaeche);color:var(--tinte);font-size:1.2rem;line-height:1;cursor:pointer;display:grid;place-items:center}
.p-plus.an{background:var(--gruen);border-color:var(--gruen);color:#fff}
/* Handy: kleinere Karten, damit mehrere Angebote auf einmal zu sehen sind */
@media (max-width:600px){
  .raster{gap:8px}
  .produkt{padding:8px 10px;gap:10px;align-items:center}
  .produkt>.bild{width:44px;height:44px;border-radius:8px}
  .produkt>.bild .ph{font-size:1.05rem}
  .p-text{gap:2px;padding-right:36px}   /* Platz für den Plus-Knopf */
  .p-text h3{font-size:.95rem;padding-right:0}
  .preisschild b{font-size:1.45rem}
  .preisschild .je{font-size:.8rem}
  .p-info{font-size:.8rem}
  .p-tags{gap:4px}
  .p-tags .tag{font-size:.7rem;padding:0 6px}
  .p-plus{top:50%;right:8px;transform:translateY(-50%);width:32px;height:32px;font-size:1.05rem}
}
.werkzeug{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.werkzeug .feld{flex:1 1 180px}

/* ---------- Produktseite ---------- */
.bestpreis{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 20px;align-items:center;background:var(--gruen-weich);border:1px solid var(--gruen);border-radius:var(--r);padding:14px 16px}
.bestpreis .gross{font:700 2.8rem/1 var(--f-display);color:var(--gruen)}
.bestpreis .gross small{font:600 1rem var(--f-text);color:var(--tinte);margin-left:4px}
.bestpreis .rechts{display:flex;flex-direction:column;gap:2px;min-width:0}
.bestpreis .rechts span{color:var(--grau);font-size:.92rem}
@media (max-width:520px){.bestpreis{grid-template-columns:minmax(0,1fr)}.bestpreis .gross{font-size:2.5rem}}
.bestpreis .unten{grid-column:1/-1;border-top:1px solid color-mix(in srgb,var(--gruen) 30%,transparent);padding-top:8px;font-size:.88rem;display:flex;flex-direction:column;gap:6px}
.marken{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.marke{flex:none;display:flex;align-items:center;gap:8px;max-width:240px;padding:6px 10px 6px 6px;border:1px solid var(--linie);border-radius:12px;background:var(--flaeche);cursor:pointer;text-align:left}
.marke.an{border-color:var(--gruen);background:var(--gruen-weich)}
.marke .bild{width:40px;height:40px;border-radius:8px}
.marke b{display:block;font-weight:600;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.marke small{color:var(--grau);font-size:.78rem}
.tabelle{background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);overflow-x:auto;box-shadow:var(--schatten)}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 8px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--linie)}
th{font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--grau);background:var(--weich)}
th button{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;white-space:nowrap}
th button.an{color:var(--tinte)}
td.zahl,th.zahl{text-align:right;white-space:nowrap}
td.gp{font:700 1.35rem var(--f-display);text-align:right;white-space:nowrap;color:color-mix(in srgb,var(--gruen) calc((1 - var(--t,0))*100%),var(--rot))}
tbody tr:last-child td{border-bottom:0}
tr.top td{background:var(--gruen-weich)}
tr.bald td{background:color-mix(in srgb,var(--gelb) 22%,transparent)}
.angebot{display:flex;gap:10px;align-items:flex-start;min-width:0}
.angebot .bild{width:42px;height:42px;border-radius:8px}
.angebot small{display:block;color:var(--grau);font-size:.8rem}
.angebot a{text-decoration:underline;text-decoration-color:var(--linie);text-underline-offset:3px}
.pruefen{display:inline-block;margin-top:4px;padding:2px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-weich);color:var(--warn);font-size:.76rem;font-weight:600;cursor:pointer}
.pruefen.ok{background:transparent;border-color:var(--linie);color:var(--grau)}
.sortier{display:none}
@media (max-width:700px){
  .sortier{display:flex}
  .tabelle{border:0;background:transparent;box-shadow:none;overflow:visible}
  table,tbody{display:block}
  thead{display:none}
  tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;background:var(--flaeche);border:1px solid var(--linie);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:var(--schatten)}
  tr.top{border-color:var(--gruen)}
  td{display:block;padding:0;border:0!important;background:none!important}
  td:first-child{grid-column:1;grid-row:1}
  td.gp{grid-column:2;grid-row:1;font-size:1.7rem;line-height:1}
  td.mobil-aus{display:none}
  td.zeile2{grid-column:1/-1;font-size:.88rem;color:var(--grau);text-align:left}
  td.zahl{text-align:left}
}
@media (min-width:701px){td.zeile2{display:none}}
.diagramm{background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);padding:10px;box-shadow:var(--schatten)}
.diagramm svg{width:100%;height:auto;display:block}
.legende{display:flex;gap:12px;flex-wrap:wrap;font-size:.84rem;margin-top:6px}
.legende i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}

/* ---------- Kacheln (Suche) ---------- */
.gruppe{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--linie)}
.gruppe:first-child{border-top:0;padding-top:0}
.gruppe-kopf{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.gruppe-kopf b{font:700 1.2rem var(--f-display)}
.kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px}
.kachel{background:var(--weich);border:1px solid var(--linie);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kachel.an{border-color:var(--gruen);box-shadow:0 0 0 1px var(--gruen);background:var(--flaeche)}
.kachel .bild{width:100%;height:72px;border-radius:8px;margin-bottom:2px}
.kachel b{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.kachel b a{text-decoration:underline dotted;text-underline-offset:2px}
.kachel small{color:var(--grau);line-height:1.3;font-size:.8rem}
.kachel .knopf{width:100%;margin-top:auto}
.kachel .knopf+.knopf{margin-top:0}
.kachel select{width:100%;min-height:34px;padding:4px 8px}

/* ---------- Liste ---------- */
.zeile{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--linie)}
.zeile:last-child{border-bottom:0}
.zeile .name b{font-weight:600}
.plink{color:inherit;text-decoration:underline dotted;text-underline-offset:3px;text-decoration-color:var(--grau)}
.plink:hover,.plink:focus-visible{text-decoration-style:solid;text-decoration-color:currentColor}
.zeile .name small{display:block;color:var(--grau);font-size:.8rem}
.zeile .x{border:0;background:transparent;color:var(--grau);font-size:1.1rem;width:34px;height:34px;border-radius:8px;cursor:pointer}
.zeile .x:hover{background:var(--weich);color:var(--rot)}
.zeile .mengen{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--linie);border-radius:10px;overflow:hidden;background:var(--flaeche)}
.stepper button{width:36px;height:36px;border:0;background:var(--weich);cursor:pointer;font-size:1.1rem}
.stepper input{width:56px;height:36px;border:0;text-align:center;background:transparent;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.einheit{font-size:.85rem;color:var(--grau)}
.rw{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--grau)}
.rw input{width:5.2rem;min-height:34px;padding:4px 8px;border:1px solid var(--linie);border-radius:8px;background:var(--flaeche)}
.rw input.vorschlag{color:var(--grau);font-style:italic;border-style:dashed}
.vorschlag-text{flex-basis:100%;margin-top:-4px;font-size:.75rem;color:var(--grau)}
.bon{background:var(--flaeche);border:1px solid var(--gruen);border-radius:var(--r);box-shadow:var(--schatten);overflow:hidden}
.bon-kopf{background:var(--gruen-weich);padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.bon-kopf small{color:var(--grau);font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.bon-kopf b{font:700 1.9rem/1.05 var(--f-display);color:var(--gruen)}
.bon-zeilen{padding:10px 16px;display:flex;flex-direction:column;gap:4px;border-top:2px dotted var(--linie)}
.bon-z{display:flex;justify-content:space-between;gap:12px}
.bon-z span:last-child{white-space:nowrap}
.bon-z.summe{border-top:1px solid var(--tinte);margin-top:4px;padding-top:6px;font-weight:600;font-size:1.08rem}
.bon-fuss{padding:10px 16px 14px;border-top:2px dotted var(--linie);display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.spart{color:var(--gruen);font-weight:600}
.eilig{color:var(--rot);font-weight:600}
.markt-teil{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--linie)}
.markt-teil:first-child{border-top:0}
.markt-kopf{display:flex;align-items:center;gap:6px;font-weight:600}
.markt-kopf .summe{margin-left:auto}
.posten{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;padding:3px 0}
.posten small{display:block;color:var(--grau);font-size:.78rem}
.posten>span:last-child{text-align:right;white-space:nowrap}
.rang{display:grid;grid-template-columns:1.6rem minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--linie)}
.rang .nr{font:700 1.2rem var(--f-display);color:var(--grau)}
.rang small{display:block;color:var(--grau);font-size:.8rem}
.rang b.s{font:700 1.25rem var(--f-display);white-space:nowrap;text-align:right}
textarea.export{font-size:.92rem;min-height:120px}

/* ---------- Einkaufen ---------- */
.fortschritt{height:8px;border-radius:4px;background:var(--weich);border:1px solid var(--linie);overflow:hidden}
.fortschritt i{display:block;height:100%;background:var(--gruen);transition:width .3s}
.haken-gruppe{display:flex;flex-direction:column}
.haken-kopf{display:flex;align-items:center;gap:6px;padding:10px 2px 6px;border-bottom:1px solid var(--linie);font-weight:600}
.haken-kopf small{margin-left:auto;color:var(--grau);font-weight:400}
.haken{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--linie)}
.haken label{flex:1;display:flex;align-items:center;gap:12px;padding:13px 4px;font-size:1.08rem;cursor:pointer;min-width:0}
.haken input{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:2px solid var(--grau);border-radius:50%;flex:none;margin:0;display:grid;place-content:center;background:transparent;cursor:pointer}
.haken input:checked{background:var(--gruen);border-color:var(--gruen)}
.haken input:checked::after{content:"✓";color:#fff;font-size:16px;line-height:1}
.haken.an span{text-decoration:line-through;color:var(--grau)}
.haken .x{border:0;background:transparent;color:var(--grau);width:34px;height:34px;border-radius:8px;cursor:pointer}

/* ---------- Preisalarm ---------- */
.alarm{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-bottom:1px solid var(--linie)}
.alarm:last-child{border-bottom:0}
.alarm-kopf{display:flex;align-items:center;gap:12px;cursor:pointer;min-width:0}
.alarm-kopf .name{flex:1;min-width:0}
.alarm-kopf .name small{display:block;color:var(--grau);font-size:.82rem}
.alarm-opt{display:flex;flex-direction:column;gap:8px;padding-left:58px}
@media (max-width:480px){.alarm-opt{padding-left:0}}
.alarm-opt .segment{align-self:flex-start;flex-wrap:nowrap}
.alarm-opt .segment button{padding:0 10px}
.toggle{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:14px;background:var(--linie);position:relative;cursor:pointer;margin:0;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.toggle:checked{background:var(--gruen)}
.toggle:checked::after{left:21px}
@media (prefers-reduced-motion:reduce){.toggle,.toggle::after{transition:none}}
.posten-info{grid-column:1/-1;font-size:.86rem;color:var(--tinte)}
.posten-info.leise{color:var(--grau)}

/* ---------- Mehr ---------- */
.formular{display:flex;flex-direction:column;gap:10px}
.formular label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--grau)}
.formular label .feld{font-size:1rem;color:var(--tinte)}
.schalter{display:flex!important;flex-direction:row!important;align-items:center;gap:10px!important;font-size:.95rem!important;color:var(--tinte)!important;cursor:pointer}
.schalter input{width:20px;height:20px;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border:1px solid var(--linie);border-radius:999px;background:var(--flaeche);font-size:.9rem;cursor:pointer}
.chip input{margin:0}
.chip.aus{opacity:.55;text-decoration:line-through}
.chip.an{background:var(--tinte);border-color:var(--tinte);color:var(--flaeche);font-weight:600}
.chip.an .km{color:inherit;opacity:.75}
.chip.leise{opacity:.6}
.mk-chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:thin}
.mk-chips .chip{flex:none}
.mk-gruppe{gap:0;padding:12px 14px}
.mk-gruppe>summary{padding:2px 0}
.mk-gruppe[open]>summary{margin-bottom:6px}
.mk-z{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--linie)}
.mk-z .bild{width:44px;height:44px;border-radius:8px}
.mk-t{min-width:0;display:flex;flex-direction:column;gap:1px}
.mk-t b{font-weight:600;overflow-wrap:anywhere}
.mk-t small{color:var(--grau);font-size:.8rem}
.mk-p{text-align:right;display:flex;flex-direction:column;white-space:nowrap}
.mk-p b{font:700 1.15rem var(--f-display)}
.mk-p .statt{color:var(--grau);font-size:.75rem;text-decoration:line-through}
.mk-k{display:flex;gap:6px}
.rund{width:36px;height:36px;border-radius:50%;border:1px solid var(--linie);background:var(--flaeche);color:var(--tinte);font-size:1.1rem;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.rund.an{background:var(--gruen);border-color:var(--gruen);color:#fff}
.mk-werkzeug .feld{flex:1 1 220px}
.t-kopf{display:flex;gap:12px;align-items:center}
.t-kopf .bild{width:64px;height:64px}
.t-markt{gap:0;padding:12px 14px}
.t-markt .box-kopf{margin-bottom:4px}
.t-markt h2{display:flex;align-items:center}
.t-z{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--linie)}
.t-info{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-link{font-size:.8rem;color:var(--grau);text-underline-offset:2px;align-self:flex-start}
@media (max-width:480px){.t-z{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t p" "t k"}.t-z .mk-t{grid-area:t}.t-z .mk-p{grid-area:p}.t-z .t-k{grid-area:k}}
.wahl select{max-width:220px}
.mk-werkzeug .segment{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.mk-werkzeug .segment button{flex:none}
@media (max-width:480px){.mk-z{grid-template-columns:40px minmax(0,1fr) auto;grid-template-areas:"b t p" "b t k";row-gap:4px}.mk-z .bild{grid-area:b;width:40px;height:40px;align-self:start}.mk-t{grid-area:t}.mk-p{grid-area:p}.mk-k{grid-area:k;justify-content:flex-end}.mk-k .rund{width:32px;height:32px;font-size:1rem}}
.formular .chip{flex-direction:row;font-size:.9rem;color:var(--tinte);gap:6px}

/* ---------- Dialog (Preis korrigieren) ---------- */
.meintest{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.9rem;color:var(--grau);padding:2px 0 6px}
.offline-hinweis{background:var(--warn-weich);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:.85rem}
.scan-kamera{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3}
.scan-kamera video{width:100%;height:100%;object-fit:cover;display:block}
.scan-kamera i{position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--rot);box-shadow:0 0 8px var(--rot)}
.scan-kamera b{position:absolute;left:10%;right:10%;top:27.5%;bottom:27.5%;border:2px solid rgba(255,255,255,.8);border-radius:8px}
.scan-produkt{display:flex;gap:10px;align-items:center}
.scan-produkt img{width:64px;height:64px;object-fit:contain;border-radius:8px;background:#fff;flex:none}
.scan-produkt small{display:block;color:var(--grau)}
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.5)}
.dialog{width:min(460px,100%);max-height:100%;overflow:auto;background:var(--flaeche);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.dialog h2{font:700 1.3rem var(--f-display)}
.dialog .reihe label{flex:1 1 110px;display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--grau)}
.dialog .reihe .feld{width:100%}

<script>
"use strict";
/* ======================================================================
   Preisvergleich: Angebote von Marktguru, Einkaufsliste mit Marktvergleich
   Datenformate (localStorage, Server) sind dieselben wie in der alten Version (alt.html),
   damit beide Versionen nebeneinander funktionieren.
   ====================================================================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>(+n).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const f1=x=>(+x).toFixed(1).replace(".",",");
const zt=x=>String(Math.round(x*100)/100).replace(".",",");
const ls={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  raw(k){try{return localStorage.getItem(k)}catch(e){return null}},
  setRaw(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
};
const objekt=v=>v&&typeof v==="object"&&!Array.isArray(v)?v:{};

/* ---------- Einheiten: Liter, kg oder Stück ---------- */
const ARTEN={l:{u:"l",wort:"Liter",std:3,min:0.5,step:0.5},kg:{u:"kg",wort:"kg",std:1,min:0.1,step:0.1},st:{u:"Stück",wort:"Stück",std:6,min:1,step:1}};
const artO=o=>(o&&ARTEN[o.art])?o.art:"l";
const unitK=a=>(ARTEN[a]||ARTEN.l).u;
const liter=o=>o.stueck*o.ml/1000;   // Menge in der Grundeinheit: Liter, kg oder Stück (bei Gewicht steht in "ml" die Gramm je Stück, bei Stück 1000)
function groesseText(ml,art){
  if(art==="kg")return ml>=1000?zt(ml/1000)+" kg":ml+" g";
  if(art==="st")return ml+" Stück";
  return ml>=1000?zt(ml/1000)+" l":ml+" ml";
}
function mengeText(o){const a=artO(o);return a==="l"?(o.stueck>1?`${o.stueck} × ${groesseText(o.ml)}`:groesseText(o.ml)):a==="kg"?(o.stueck>1?`${o.stueck} × ${groesseText(o.ml,"kg")}`:groesseText(o.ml,"kg")):`${o.stueck} Stück`}
let appPreise=ls.raw("pv-app")==="1";
const pr=o=>appPreise&&o.app?o.app:o.preis;
const gp=o=>pr(o)/liter(o);
const grp=o=>o.gruppe||"Coca-Cola";

/* ---------- Datum ---------- */
const heute0=()=>{const t=new Date();t.setHours(0,0,0,0);return t};
const tageBis=s=>s?Math.round((new Date(s+"T00:00:00")-heute0())/864e5):null;
const tage=o=>tageBis(o.bis);
const kommt=o=>{const d=tageBis(o.von);return d!==null&&d>0};
const abgelaufen=o=>{const d=tage(o);return d!==null&&d<0};
const kurzD=s=>new Date(s+"T00:00:00").toLocaleDateString("de-DE",{day:"numeric",month:"numeric"});
const tagD=s=>new Date(s+"T00:00:00").toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"numeric"});
const jahrD=s=>new Date(s+"T00:00:00").toLocaleDateString("de-DE",{day:"numeric",month:"numeric",year:"2-digit"});
function gueltig(o){
  const a=tageBis(o.von);if(a!==null&&a>0)return a===1?"ab morgen":"ab "+tagD(o.von);
  const d=tage(o);if(d===null)return"Gültigkeit unbekannt";if(d<0)return"abgelaufen";if(d===0)return"nur noch heute";if(d===1)return"bis morgen";return"bis "+tagD(o.bis);
}

/* ---------- Märkte: Farbpunkt statt Logo ---------- */
const MFARBE={lidl:"#0050aa",aldi:"#00a0e0",kaufland:"#e10915",rewe:"#cc071e",penny:"#cd1719",netto:"#f2c500",edeka:"#005ca9",trinkgut:"#0b7a3b","thomas philipps":"#e2001a",handelshof:"#00843d",rossmann:"#c8102e","getränke hoffmann":"#e30613",norma:"#d6001c",globus:"#f39200",marktkauf:"#0b5aa8",famila:"#d4001a"};
const mbase=m=>String(m).replace(/\s*\(\d+\)\s*$/,"").trim();
function mlogo(m){
  const k=mbase(m).toLowerCase();let c=null;
  for(const x in MFARBE)if(k.startsWith(x)){c=MFARBE[x];break}
  if(!c){let s=0;for(const ch of k)s=(s*31+ch.charCodeAt(0))%360;c="hsl("+s+" 45% 42%)"}
  return `<span class="mb" style="background:${c}" aria-hidden="true"></span>`;
}
const bildHtml=(url,text)=>`<span class="bild"><span class="ph">${esc((String(text||"?")[0]||"?").toUpperCase())}</span>${url&&/^https?:\/\//.test(url)?`<img src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}</span>`;

/* ---------- Gespeicherter Zustand (gleiche Schlüssel wie die alte Version) ---------- */
let zettel=objekt(ls.get("pv-zettel",{}));    // Einkaufsliste: "Name" oder "Name|ml" -> Menge in l / kg / Stück
let frei=objekt(ls.get("pv-frei",{}));        // Artikel ohne Angebot: Name -> Einheit
let richt=objekt(ls.get("pv-richt",{}));      // Richtwert (Normalpreis): Name -> € je Einheit
let haken=objekt(ls.get("pv-haken",{}));      // abgehakt beim Einkaufen
let extra=(ls.get("pv-extra",[])||[]).filter(x=>typeof x==="string");   // von Hand notierte Artikel
let wahl=objekt(ls.get("pv-wahl",{}));         // Einkaufsliste: Artikel -> fest gewählter Markt (sonst rechnet die App den günstigsten aus)
let aus=new Set(ls.get("pv-aus",[])||[]);     // ausgeblendete Märkte
let korr=objekt(ls.get("pv-korr",{}));        // eigene Preiskorrekturen
let ort=ls.get("pv-ort",null);                // eigener Standort
let kmSatz=(()=>{const x=parseFloat(ls.raw("pv-km"));return x>=0&&x<5?x:.30})();
let tourArt=ls.raw("pv-tour")==="tour"?"tour":"getrennt";
let theme=ls.raw("pv-theme")||"auto";
let zugang=ls.raw("pv-code")||"";             // Zugangscode des Betreibers
let konto=ls.get("pv-konto",null);
let favsLokal=(ls.get("pv-favs",[])||[]).filter(f=>f&&typeof f.name==="string");   // eigene Favoriten ohne Zugangscode
let vd=ls.get("pv-verlauf",[])||[];           // Preisverlauf: [datum, markt, preis je Einheit, bis, von, gruppe, menge]
let kurzName=ls.raw("pv-kurz")||"Einkaufsliste in Erinnerungen";

/* ---------- Angebote aufbereiten ---------- */
const RE1=/(\d+)\s*[x×]\s*(\d+(?:\.\d+)?)\s*-?\s*(milliliter|ml|centiliter|cl|liter|ltr|l)\b/,RE2=/(\d+(?:\.\d+)?)\s*-?\s*(milliliter|ml|centiliter|cl|liter|ltr|l)\b/;
function mengeAusText(t){
  t=(t||"").toLowerCase().replace(/,/g,".").replace(/(\d)\s*i\b/g,"$1 l");
  let n=1,v,u,m=t.match(RE1);
  if(m){n=+m[1];v=+m[2];u=m[3]}else{m=t.match(RE2);if(!m)return null;v=+m[1];u=m[2]}
  return {stueck:n,ml:Math.round(u==="ml"||u==="milliliter"?v:u==="cl"||u==="centiliter"?v*10:v*1000)};
}
// Verpackung aus Pfand und Text: 0,25 € je Stück = Einweg, 0,15 € = Mehrweg-PET, 0,08 € = Mehrweg-Glas; 1,50 € Kastenpfand wird mitgeprüft
function formVon(t,ml,g,n,art){
  if(art&&art!=="l")return"";
  t=(t||"").toLowerCase().replace(/,/g,".").replace(/[–-]\s*\.(\d\d)/g,"0.$1");n=n>=1?n:1;
  const dose=/dose/.test(t),glas=/glas/.test(t),pet=/\bpet\b/.test(t),karton=/tetra|karton|brik|beutel|pfandfrei/.test(t),
        mw=/mehrweg|\bmw\b/.test(t),ew=/einweg|\bew\b/.test(t),kasten=/kasten|kästen/.test(t),marke=/^(red bull|monster)/i.test(g||"");
  const mx=t.match(/(\d+)\s*[x×]\s*\d+(?:\.\d+)?\s*-?\s*(?:ml|cl|l)\b/),nT=mx?+mx[1]:n;
  const nah=(x,w)=>Math.abs(x-w)<=0.012,wert=x=>[25,15,8].find(w=>nah(x*100,w));
  let pc=null;
  const ex=t.match(/pfand[^0-9]{0,8}\d+\s*x\s*(\d+\.\d\d)/),tot=t.match(/(\d+\.\d\d)\s*(?:€\s*)?pfand/)||t.match(/pfand[^0-9]{0,8}(\d+\.\d\d)/);
  if(ex)pc=wert(+ex[1])??null;
  if(pc===null&&tot){
    const P=+tot[1],k=[P/nT,(P-1.5)/nT];if(kasten)k.reverse();
    for(const x of k){const w=wert(x);if(w){pc=w;break}}
    if(pc===null&&P>=2.5&&(kasten||nT>=12))pc=ml>=1000?15:8;
  }
  if(karton&&!dose&&!glas&&!pet&&pc===null)return"Karton";
  if(pc===25||(pc===null&&ew&&!mw))return dose||marke?"Dose":glas?"Glas-Einweg":pet?"PET-Einweg":ml<=355?"Dose":"PET-Einweg";
  if(pc===15||pc===8||(pc===null&&mw))return glas?"Glas-Mehrweg":pet?"PET-Mehrweg":dose?"Dose":pc===8?"Glas-Mehrweg":ml>=1000?"PET-Mehrweg":"Glas-Mehrweg";
  return marke||dose?"Dose":glas?"Glas-Mehrweg":pet?"PET-Einweg":ml<=355?"Dose":"PET-Einweg";
}
const sorteVon=t=>{t=t.toLowerCase();return /zero|sugar|zuckerfrei|ultra/.test(t)?"Zero":/light/.test(t)?"Light":/cherry|kirsch/.test(t)?"Cherry":/vanill/.test(t)?"Vanilla":/lemon|zitron/.test(t)?"Lemon":"Classic"};
const appPreisVon=t=>{const m=(t||"").match(/(?:lidl plus|app)[^0-9]{0,12}(\d+[.,]\d{2})\s*€/i);return m?+m[1].replace(",","."):null};

const flachT=t=>String(t||"").toLowerCase().replace(/ß/g,"ss").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").normalize("NFD").replace(/[\u0300-\u036f]/g,"");

/* Korrekturen auffälliger Preise (gleicher Schlüssel wie bisher, mit Zugangscode auf dem Server geteilt) */
let korrSrv={};
function korrKey(o){const p=o.orig||o;return [grp(o),o.markt,o.produkt||"",o.von||"",o.bis||"",p.preis,p.stueck,p.ml].join("|")}
function korrAnwenden(o){

function aufbereiten(arr){
  const neu=[];let skip=0;
  (Array.isArray(arr)?arr:[]).forEach((x,i)=>{
    if(!x)return;
    const art=ARTEN[x.art]?x.art:"l",mg=x.stueck>=1&&x.ml>0?{stueck:x.stueck,ml:x.ml}:(art==="l"?(mengeAusText(x.beschreibung)||mengeAusText(x.produkt)):null);
    if(!mg||!(x.preis>0)){skip++;return}
    const t=(x.beschreibung||"")+" "+(x.produkt||"");
    const o={id:i,markt:x.markt||"?",produkt:x.produkt||"",info:x.beschreibung||"",art,gruppe:x.gruppe||"Coca-Cola",marke:x.marke||"",bild:x.bild||"",
      stueck:mg.stueck,ml:mg.ml,preis:+x.preis,alt:x.preis_alt>x.preis?+x.preis_alt:null,form:formVon(t,mg.ml,x.gruppe,mg.stueck,art),
      sorte:art==="l"?sorteVon(t):"",app:appPreisVon(x.beschreibung),limit:limitVon(x.beschreibung),bis:x.gueltig_bis||"",von:x.gueltig_von||"",link:x.link||"",geladen:x.abgefragt||""};
    o.k=korrKey(o);korrAnwenden(o);neu.push(o);

  const z={};neu.forEach(o=>{const g=o.gruppe,a=o.art;(z[g]=z[g]||{})[a]=(z[g][a]||0)+1});

  const rest=neu.filter(o=>o.art===dom[o.gruppe]);
  return {liste:rest,skip:skip+neu.length-rest.length};
}

/* ---------- Mitteilungen (Web-Push) auf diesem Gerät: auf dem iPhone nur in der App vom Home-Bildschirm (ab iOS 16.4) ---------- */
const pushGeht=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
const istIOS=()=>/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const alsApp=()=>navigator.standalone===true||!!(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);

const b64uBytes=t=>Uint8Array.from(atob(t.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((t.length+3)%4)),c=>c.charCodeAt(0));
const gleicheBytes=(a,b)=>{if(!a||!b)return false;a=new Uint8Array(a);return a.length===b.length&&a.every((x,i)=>x===b[i])};
const swBereit=()=>Promise.race([navigator.serviceWorker.ready,new Promise((_,f)=>setTimeout(()=>f(new Error("Der Hintergrunddienst der App startet nicht. Schließe die App einmal ganz und öffne sie neu.")),8000))]);
async function pushStandLaden(){
  const P=S.push;
  if(!cf||!pushGeht()){P.stand="nicht";return}
  if(Notification.permission==="denied"){P.stand="verweigert";return}
  try{const reg=await navigator.serviceWorker.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();P.stand=sub&&Notification.permission==="granted"?"an":"aus";P.ep=sub?sub.endpoint:""}catch(e){P.stand="aus"}
  try{P.server=await (await wf("/push/status")).json()}catch(e){}
}
async function pushAn(){
  const P=S.push;if(P.busy)return;P.busy=true;render();
  try{
    const erlaubt=await Notification.requestPermission();   // direkt nach dem Tippen fragen, sonst zeigt iOS die Abfrage nicht
    if(erlaubt!=="granted"){P.stand=erlaubt==="denied"?"verweigert":"aus";throw Object.assign(new Error(erlaubt==="denied"?"Mitteilungen sind für die App nicht erlaubt.":"Ohne deine Erlaubnis kann ich keine Mitteilungen schicken."),{status:1})}
    const schl=b64uBytes((await (await wf("/push/schluessel")).json()).key);
    const reg=await swBereit();

    if(sub&&!gleicheBytes(sub.options&&sub.options.applicationServerKey,schl)){await sub.unsubscribe().catch(()=>{});sub=null}
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:schl});

}

  if(!terms.length){roh=[];neuAufbereiten();cacheSpeichern(quelle);return}

  for(let i=0;i<terms.length;i+=6){
    try{alle=alle.concat(await (await wf("/region?plz="+plz+"&streng=1&q="+encodeURIComponent(terms.slice(i,i+6).join("|"))+(frisch?"&neu=1":""))).json())}

  clearTimeout(alarmT);alarmT=setTimeout(()=>{favsSpeichern(favs(),true).then(()=>melde("Preisalarm gespeichert.")).catch(e=>melde(netzFehler(e),true))},700);

/* Preise neu holen. Beim Betreiber fragt der Server Marktguru neu ab, sonst die öffentliche Abfrage (höchstens alle 15 Minuten neu). */
async function serverAktualisieren(still){
  if(laeuft)return;

/* ---------- Entfernungen: Luftlinie zur nächsten Filiale, mit eigener Adresse echte Fahrstrecke (OSRM) ---------- */
const STRASSE=1.3;   // die Straße ist im Schnitt etwa 1,3-mal so lang wie die Luftlinie
let strasse={},strasseKey="",strMat=null;
{const s=ls.get("pv-strasse",null);if(s&&s.k&&s.w){strasse=s.w;strasseKey=s.k;strMat=s.mat||null}}
function luftKm(a,b,c,d){const r=x=>x*Math.PI/180,q=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(q))}
const ortKey=()=>ort?ort.lat.toFixed(4)+","+ort.lon.toFixed(4):"";
function dinfo(m){
  const d=dist[mbase(m)];if(!d)return null;
  if(ort&&d.filialen&&d.filialen.length){
    let best=null;
    for(const f of d.filialen){const k=luftKm(ort.lat,ort.lon,f[0],f[1]);if(!best||k<best.km)best={km:k,adresse:f[2]}}
    const w=strasseKey.startsWith(ortKey()+"|")?strasse[mbase(m)]:null;
    if(best&&w){best.weg=w.km;best.min=w.min;best.wegAdresse=w.adresse}
    return best;
  }
  return !ort&&d.km!=null?{km:d.km,adresse:d.adresse}:null;
}
const dkm=m=>{const d=dinfo(m);return d?(d.weg!=null?d.weg:d.km):null};
const fakt=m=>{const d=dinfo(m);return d&&d.weg!=null?1:STRASSE};
function kmText(m){const d=dinfo(m);if(!d)return"";return d.weg!=null?`${f1(d.weg)} km${d.min!=null?" · "+d.min+" min":""}`:`${f1(d.km)} km`}
async function distLaden(){
  try{
    const rp=regionPlz();

      const marken=[...new Set(offers.map(o=>mbase(o.markt)))].slice(0,12);
      if(!marken.length)return;
      for(let i=0;i<5;i++){   // der Server rechnet im Hintergrund, bis zu etwa 20 Sekunden
        dist=await (await wf("/entfernungen?plz="+rp+"&m="+encodeURIComponent(marken.join("|")))).json();
        render();
        if(marken.every(m=>dist[m]))break;
        await new Promise(r=>setTimeout(r,12000));
        if(regionPlz()!==rp)return;
      }
    }else{
      dist=await (await wf("/entfernungen")).json();
      const fehlt=[...new Set(offers.map(o=>mbase(o.markt)))].filter(x=>!(dist[x]&&("filialen" in dist[x]||dist[x].km!=null)));
      if(fehlt.length&&betreiber())dist=await (await wf("/entfernungen?m="+encodeURIComponent(fehlt.join("|")),{method:"POST"})).json();

  }catch(e){}
}
async function strasseLaden(){
  if(!ort||!Object.keys(dist).length)return;
  const maerkte=new Set(offers.map(o=>mbase(o.markt))),z=[];
  Object.entries(dist).forEach(([m,d])=>{
    if(!maerkte.has(m)||!d||!d.filialen)return;
    d.filialen.map(f=>({m,lat:f[0],lon:f[1],adr:f[2],k:luftKm(ort.lat,ort.lon,f[0],f[1])})).sort((a,b)=>a.k-b.k).slice(0,3).forEach(x=>z.push(x));
  });
  if(!z.length||z.length>60)return;
  const k=ortKey()+"|"+z.map(x=>x.lat.toFixed(4)+x.lon.toFixed(4)).join(",");
  if(k===strasseKey&&strMat)return;
  const holen=async url=>{const ac=new AbortController(),to=setTimeout(()=>ac.abort(),9000);try{const r=await fetch(url,{signal:ac.signal});return r.ok?await r.json():null}finally{clearTimeout(to)}};
  try{
    const c=[[ort.lon,ort.lat],...z.map(x=>[x.lon,x.lat])].map(q=>q[0].toFixed(5)+","+q[1].toFixed(5)).join(";");
    const j=await holen("https://router.project-osrm.org/table/v1/driving/"+c+"?sources=0&annotations=distance,duration");
    if(!j||j.code!=="Ok"||!j.distances||!j.distances[0])return;
    const w={};
    z.forEach((x,i)=>{const dm=j.distances[0][i+1],du=j.durations&&j.durations[0][i+1];if(dm==null)return;const km=dm/1000;if(!w[x.m]||km<w[x.m].km)w[x.m]={km,min:du!=null?Math.round(du/60):null,adresse:x.adr,lat:x.lat,lon:x.lon}});
    if(!Object.keys(w).length)return;
    strasse=w;strasseKey=k;strMat=null;ls.set("pv-strasse",{k,w});render();

    if(!j2||j2.code!=="Ok"||!j2.distances)return;
    const mat={};ms.forEach((a,i)=>ms.forEach((b,x)=>{const dm=j2.distances[i+1]&&j2.distances[i+1][x+1];if(a!==b&&dm!=null)mat[a+"|"+b]=dm/1000}));
    strMat=mat;ls.set("pv-strasse",{k,w,mat});render();

}

/* ---------- Konto (ohne E-Mail): der Browser rechnet aus Passwort und Namen einen Schlüssel, der Server sieht das Passwort nie ---------- */
let kPush=null;
async function dkVon(name,pw){
  const enc=new TextEncoder(),k=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
  const b=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:enc.encode(name.trim().toLowerCase()+"|preisvergleich"),iterations:200000},k,256);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function kFetch(pfad,methode,body,token){

}

let kOffen=ls.raw("pv-konto-offen")==="1";

async function kontoLaden(start,erstmals){

    if(Array.isArray(d.aus)){aus=new Set((start&&!erstmals)?d.aus:[...d.aus,...aus]);ls.set("pv-aus",[...aus])}

      const n=new Map();((start&&!erstmals)?d.favs:[...d.favs,...favsLokal]).forEach(f=>{if(f&&f.name&&!n.has(f.name))n.set(f.name,f)});

<script>

  mk:{id:ls.raw("pv-markt")||"",liste:null,plz:"",laedt:false,lade:{},versucht:{},fehler:{},daten:{},q:"",zeit:"jetzt",bereich:"L"},   // Angebote je Markt

/* ---------- Einkaufsliste: Schlüssel "Name" (alle Größen) oder "Name|ml" (nur diese Größe) ---------- */
function zk(k){const m=String(k).match(/^(.*)\|(\d+)$/);return m?{g:m[1],ml:+m[2]}:{g:String(k),ml:0}}
function artG(g){
  const o=offers.find(q=>grp(q)===g);if(o)return o.art;
  if(ARTEN[frei[g]])return frei[g];if(ARTEN[artMerk[g]])return artMerk[g];
  const f=favVon(g),e=f&&f.alarm&&f.alarm.einheit;return e==="stueck"?"l":ARTEN[e]?e:"st";
}
function zLabel0(k){const x=zk(k);return x.ml?x.g+" "+groesseText(x.ml,artG(x.g)):x.g}
/* Favoriten aus derselben Suche mit derselben Einheit bilden eine Gruppe: im Vergleich zählt das günstigste Produkt der Gruppe */
function favSuche(g){const f=favVon(g);return f&&f.suche?String(f.suche).trim().toLowerCase():""}

function veraltet(k){const g=zk(k).g;return offers.length>0&&!favVon(g)&&!frei[g]&&!offers.some(o=>grp(o)===g)}
function zGruppen(){
  const akt=Object.keys(zettel).filter(k=>zettel[k]>0&&!veraltet(k)).sort((a,b)=>zLabel0(a).localeCompare(zLabel0(b),"de")),m=new Map();
  akt.forEach(k=>{const id=gidVon(k);if(!m.has(id))m.set(id,[]);m.get(id).push(k)});

function zRef(k){

function zMengeText(k){const a=artG(zk(k).g),r=zRef(k),v=zettel[k];return r?`${zt(v/r)} Stück à ${groesseText(Math.round(r*1000),a)}`:`${zt(v)} ${ARTEN[a].u}`}

function mengenRunden(){
  let neu=false;
  zGruppen().forEach(l=>{
    const r=zRef(l[0]);if(!r)return;
    const v=Math.round(Math.max(1,Math.round(zettel[l[0]]/r))*r*1e4)/1e4;

/* Normalpreis je Einheit: dein eigener; sonst ein Vorschlag aus dem früheren Preis („statt …“), den Marktguru manchmal mitliefert
   (der niedrigste je Einheit, damit die Ersparnis nicht zu groß wirkt); gibt es beides nicht, bleibt das Feld leer */
const rwEigen=k=>{const n=zMitglieder(k).map(x=>zk(x).g).find(n=>richt[n]>0);return n?richt[n]:null};
let rwC={};
function rwVorschlag(k){
  if(k in rwC)return rwC[k];
  let b=null;
  for(const x of zMitglieder(k)){const {g,ml}=zk(x);for(const o of offers)if(grp(o)===g&&(!ml||o.ml===ml)&&o.alt>o.preis&&!o.ausb){const v=o.alt/liter(o);if(v>0&&(!b||v<b.v))b={v:Math.round(v*1e4)/1e4,o}}}

const rwPreis=k=>{const e=rwEigen(k);if(e!=null)return e;const v=rwVorschlag(k);return v?v.v:null};
const rwKosten=k=>{const r=rwPreis(k);return r==null?null:Math.round(zettel[k]*r*100)/100};
function aufListeSetzen(k,menge){   // Artikel auf die Liste; in einer Gruppe gilt deren Menge
  const gl=Object.keys(zettel).filter(q=>zettel[q]>0&&q!==k&&gidVon(q)===gidVon(k));
  zettel[k]=menge>0?menge:(gl.length?zettel[gl[0]]:zStd(k));
}
function vonListe(g){Object.keys(zettel).filter(k=>zk(k).g===g).forEach(k=>{delete zettel[k];delete wahl[k]})}

const wahlVon=k=>[k,...zMitglieder(k)].map(x=>wahl[x]).find(Boolean)||"";

/* ---------- Angebote je Artikel und Markt ---------- */
function fvAngebote1(k){const {g,ml}=zk(k);return offers.filter(o=>grp(o)===g&&(!ml||o.ml===ml)&&!o.ausb&&!abgelaufen(o)&&!aus.has(o.markt)&&(S.lzeit==="jetzt"?!kommt(o):kommt(o)))}
function fvAngebote(k){const l=zMitglieder(k);return l.length>1?l.flatMap(fvAngebote1):fvAngebote1(k)}
function maxPack(o){   // Kauflimit ("max. 2 Packungen", "max. 6 Flaschen") in ganzen Packungen
  if(!o.limit)return Infinity;
  const m=String(o.limit).match(/(\d+)\s*([a-zäöüß]+)/i);if(!m)return Infinity;
  const n=+m[1],u=m[2].toLowerCase();let p;
  if(/^(stück|stk|flasche|dose|kapsel|beutel)/.test(u))p=Math.floor(n/Math.max(1,o.stueck));

let fvLimit={};
/* beste Packungswahl in einem Markt: ganze Packungen nah an der Menge (höchstens die Hälfte darüber), davon die günstigste; Kauflimits werden beachtet */
function fvWahl(k,os){
  const need=zettel[k];
  const einzel=os.map(o=>{const lv=liter(o),packs=Math.max(1,Math.ceil(need/lv-0.06));return {o,packs,vol:packs*lv,over:packs*lv-need,kosten:packs*pr(o),teile:[{o,packs}],lim:maxPack(o)}}).filter(x=>x.packs<=x.lim);
  let ok=einzel.filter(x=>x.over<=need/2+1e-9);if(!ok.length&&einzel.length)ok=einzel.slice().sort((a,b)=>Math.abs(a.over)-Math.abs(b.over)).slice(0,1);
  if(ok.length)return ok.sort((a,b)=>a.kosten-b.kosten||a.over-b.over)[0];

  for(const o of os.slice().sort((a,b)=>gp(a)-gp(b))){
    if(vol>=need*0.94)break;

    if(take<1)continue;

  }

}
function fvBest(namen){
  const t={};fvLimit={};
  namen.forEach(k=>{
    const nach={};fvAngebote(k).forEach(o=>{(nach[mbase(o.markt)]=nach[mbase(o.markt)]||[]).push(o)});
    Object.entries(nach).forEach(([m,os])=>{t[m]=t[m]||{};const w=fvWahl(k,os);if(w)t[m][k]=w;else fvLimit[m+"|"+k]=true});
  });

}
/* Fahrt: hin und zurück, bei zwei Märkten wahlweise als eine Tour */
function fvFahrt(m){const d=dkm(m);return d==null?null:2*d*kmSatz*fakt(m)}
function mKoord(m){
  const w=strasseKey.startsWith(ortKey()+"|")?strasse[m]:null;if(w&&w.lat!=null)return [w.lat,w.lon];
  const d=dist[m];if(!ort||!d||!d.filialen||!d.filialen.length)return null;
  let b=null;for(const f of d.filialen){const k=luftKm(ort.lat,ort.lon,f[0],f[1]);if(!b||k<b.k)b={k,c:[f[0],f[1]]}}return b.c;
}
function zwKm(a,b){
  if(strMat&&strMat[a+"|"+b]!=null&&strasseKey.startsWith(ortKey()+"|"))return {km:strMat[a+"|"+b],echt:true};
  const ca=mKoord(a),cb=mKoord(b);if(!ca||!cb)return null;
  return {km:luftKm(ca[0],ca[1],cb[0],cb[1])*STRASSE,echt:false};
}
function tourFahrt(ms){
  if(!ort||ms.length!==2)return null;
  const [a,b]=ms,da=dkm(a),db=dkm(b);if(da==null||db==null)return null;
  const ha=da*fakt(a),hb=db*fakt(b),ab=zwKm(a,b),ba=zwKm(b,a);if(!ab||!ba)return null;
  const o1=ha+ab.km+hb,o2=hb+ba.km+ha,km=Math.min(o1,o2);

}
/* Ein Plan für eine Auswahl von Märkten (einer oder zwei): jeder Artikel in den günstigsten dieser Märkte.
   Gibt es ihn dort nicht im Angebot, zählt dein Normalpreis (ca.), sonst bleibt er "offen" (kaufst du ohne Angebot).
   Zum Vergleichen der Pläne zählt ein offener Artikel mit seinem teuersten Angebotspreis, damit ein Plan nicht nur deshalb billig wirkt, weil er weniger abdeckt. */
function planVon(ms,namen,t,ersatz,ohneR,fest){
  const zu={},rw=[],offen=[];let ware=0,rwSumme=0,strafe=0;
  for(const g of namen){
    if(fest&&fest[g]){zu[g]=fest[g];ware+=fest[g].w.kosten;continue}   // Markt selbst gewählt
    let b=null;
    for(const m of ms){const w=t[m]&&t[m][g];if(w&&(!b||w.kosten<b.w.kosten))b={m,o:w.o,w}}
    const r=rwKosten(g);
    if(b&&(r==null||b.w.kosten<=r)){zu[g]=b;ware+=b.w.kosten}
    else if(r!=null){rw.push(g);rwSumme+=r}
    else{offen.push(g);strafe+=ersatz[g]}
  }
  ohneR.forEach(g=>{rw.push(g);rwSumme+=rwKosten(g)});
  const benutzt=[...new Set(Object.values(zu).map(x=>x.m))];
  let fahrt=0,unbekannt=false,tour=null;
  if(tourArt==="tour"&&benutzt.length===2)tour=tourFahrt(benutzt);
  if(tour)fahrt=tour.kosten;else benutzt.forEach(m=>{const f=fvFahrt(m);if(f==null)unbekannt=true;else fahrt+=f});
  const gesamt=ware+rwSumme+fahrt;
  return {ms:benutzt,zu,rw,offen,ware,rwSumme,fahrt,gesamt,wert:gesamt+strafe,anzahl:Object.keys(zu).length,unbekannt,tour};
}
function expName(g,w){const gr=zMitglieder(g).length>1;return (gr&&w?(w.teile[0].o.gruppe||zLabel(g)):zLabel(g)).replace(/ \(ohne Angebot\)$/,"")}
function expPlan(label,p,fehl){const wo={};Object.entries(p.zu).forEach(([g,x])=>{(wo[x.m]=wo[x.m]||[]).push([g,x.w])});return {label,wo,rw:[...p.rw,...p.offen],fehl:fehl.slice()}}
/* Der ganze Vergleich (einmal je Neuzeichnen berechnet) */
let vCache=null;
function vergleich(){
  if(vCache)return vCache;
  const namen=zettelNamen(),t=fvBest(namen),ms=Object.keys(t),ersatz={};
  namen.forEach(g=>{ms.forEach(m=>{const w=t[m][g];if(w&&(ersatz[g]==null||w.kosten>ersatz[g]))ersatz[g]=w.kosten})});
  const mit=namen.filter(g=>ersatz[g]!=null),ohne=namen.filter(g=>ersatz[g]==null);
  const ohneR=ohne.filter(g=>rwKosten(g)!=null),fehlend=ohne.filter(g=>rwKosten(g)==null);
  const ein=[],paare=[];
  if(mit.length){
    ms.forEach(m=>{const p=planVon([m],mit,t,ersatz,ohneR);if(p.ms.length)ein.push(p)});
    for(let i=0;i<ms.length;i++)for(let j=i+1;j<ms.length;j++){const p=planVon([ms[i],ms[j]],mit,t,ersatz,ohneR);if(p.ms.length===2)paare.push(p)}
  }
  const ordnung=(a,b)=>a.wert-b.wert||b.anzahl-a.anzahl;
  ein.sort(ordnung);
  // Selbst gewählte Märkte: diese Artikel kaufst du dort, die übrigen im günstigsten Plan aus diesen Märkten und höchstens einem weiteren
  const fest={};
  mit.forEach(g=>{const m=wahlVon(g);if(m&&t[m]&&t[m][g])fest[g]={m,o:t[m][g].o,w:t[m][g],fest:true}});
  const P=[...new Set(Object.values(fest).map(x=>x.m))];
  const plaene=P.length?[P,...ms.filter(m=>!P.includes(m)).map(m=>[...P,m])].map(c=>planVon(c,mit,t,ersatz,ohneR,fest)).sort(ordnung):[...ein,...paare].sort(ordnung),beste=plaene[0]||null;
  const nah=ein.slice().sort((x,y)=>(dkm(x.ms[0])??99)-(dkm(y.ms[0])??99))[0],vgl=nah&&nah!==beste?nah:null;
  let plaeneExp;
  if(!mit.length)plaeneExp=[{label:"Einkaufsliste",wo:{},rw:ohneR.slice(),fehl:fehlend.slice()}];
  else plaeneExp=[expPlan("Beste Wahl: "+beste.ms.join(" + "),beste,fehlend),...ein.filter(p=>p!==beste).map(p=>expPlan("Alles bei "+p.ms[0],p,fehlend))];
  return vCache={namen,t,mit,ohneR,fehlend,ersatz,plaene,beste,ein,vgl,plaeneExp,fest};
}
/* Gruppen zum Einkaufen und für den Export: [{kopf, namen:[{k, name, z (Listen-Schlüssel) | eigen}]}], nächster Markt zuerst */
function expGruppen(){
  const V=vergleich(),p=V.plaeneExp[Math.min(S.plan,V.plaeneExp.length-1)];
  const ms=Object.keys(p.wo).sort((a,b)=>(dkm(a)??99)-(dkm(b)??99));
  const out=ms.map(m=>({kopf:m,namen:p.wo[m].map(([g,w])=>({k:m+"|"+expName(g,w),name:expName(g,w),z:g}))}));
  const ohne=[...p.rw,...p.fehl].map(g=>({k:"*|"+expName(g),name:expName(g),z:g}));
  if(ohne.length)out.push({kopf:"Egal wo (kein Angebot)",namen:ohne});
  if(extra.length)out.push({kopf:"Sonstiges",namen:extra.map(n=>({k:"+|"+n,name:n,eigen:true}))});
  return out;
}
function exportText(){
  const z=[];
  expGruppen().forEach(gr=>{
    if(S.expFmt==="kopf"){z.push("— "+gr.kopf+" —");gr.namen.forEach(x=>z.push(x.name))}
    else gr.namen.forEach(x=>z.push(gr.kopf.startsWith("Egal wo")||gr.kopf==="Sonstiges"?x.name:x.name+" ("+gr.kopf+")"));
  });
  return z.join("\n");
}

/* ---------- Produktseite: Hilfen ---------- */
let medC={};
function typisch(g){   // Median des Preises je Einheit aller gültigen Angebote (mindestens 3)
  if(g in medC)return medC[g];
  const w=offers.filter(o=>grp(o)===g&&!o.ausb&&!abgelaufen(o)).map(gp).sort((a,b)=>a-b),n=w.length;
  return medC[g]=n<3?null:n%2?w[(n-1)/2]:(w[n/2-1]+w[n/2])/2;
}
function auff(o){if(o.korr||o.ok||o.ausb)return"";const m=typisch(grp(o));if(!m)return"";const x=gp(o);return x>4*m?"hoch":x<m/3?"niedrig":""}
/* Ampel: Preis im Vergleich zum eigenen Durchschnitt der letzten 8 Wochen */
function ampelInfo(b){
  if(!vd||!vd.length)return null;
  const g=grp(b),heute=new Date().toISOString().slice(0,10),t={};
  vd.forEach(([d,m,p,bis,von,gr])=>{
    if((gr||"Coca-Cola")!==g||d>=heute||(bis&&bis<d)||(von&&von>d)||aus.has(m))return;
    if(!(t[d]<=p))t[d]=p;
  });
  const alle=Object.keys(t).sort(),v=b.preis/liter(b),letzte=alle.slice(-56);
  let so="",i=alle.length-1,tief=null;
  while(i>=0&&Math.abs(t[alle[i]]-v)<=v*.005)i--;
  if(i>=0){
    const k=alle.slice(0,i+1).filter(d=>t[d]<=v*1.005).pop();so=k?"So günstig war es zuletzt am "+jahrD(k)+".":"Seit Beginn der Aufzeichnung ("+jahrD(alle[0])+") war es nie so günstig.";
    // Bestpreis seit mindestens 6 Wochen (oder überhaupt, bei mindestens 4 Wochen Aufzeichnung): Hinweis zum Vorrat-Kaufen
    const wo=d=>Math.floor((Date.parse(heute)-Date.parse(d))/6048e5);
    if(k?wo(k)>=6:wo(alle[0])>=4&&alle.length>=10)tief={wochen:k?wo(k):null,seit:k||alle[0],haltbar:haltbar(g,b)};
  }
  if(letzte.length<3)return {n:letzte.length,so,tief};
  const avg=letzte.reduce((s,d)=>s+t[d],0)/letzte.length,r=(v/avg-1)*100;
  const [stufe,txt]=r<=-8?["gruen","Guter Preis"]:r<=8?["","Normaler Preis"]:["rot","Eher teuer"];
  return {stufe,txt,r,avg,n:letzte.length,so,tief};
}
// Frische Ware kauft man nicht auf Vorrat (H-Milch und Haltbares schon)
const FRISCH=/milch|joghurt|quark|sahne|käse|kaese|butter|fleisch|hack|wurst|schinken|salami|hähnchen|haehnchen|huhn|pute|fisch|lachs|brot|brötchen|obst|gemüse|salat|eier|banane|äpfel|apfel|birne|tomate|gurke|paprika|beere|trauben|kartoffel|zwiebel|pilz|champignon|aufschnitt|frisch/i;
function haltbar(g,o){const t=g+" "+(o&&o.produkt||"");return /h-milch|haltbar|konserve|dose/i.test(t)||!FRISCH.test(t)}
const tiefText=x=>x.wochen?"Bestpreis seit "+x.wochen+" Wochen":"Tiefstpreis seit Beginn";
function gewaehlt(o){const f=favVon(grp(o));return !f||!f.nur||!f.nur.length||!lokalModus()||f.nur.map(nurK).includes(nurK(kKey(o)))}
function gruppenInfo(g){
  const alle=offers.filter(o=>grp(o)===g&&!o.ausb&&!abgelaufen(o)&&!aus.has(o.markt)&&gewaehlt(o));
  const jetzt=alle.filter(o=>!kommt(o)),spaeter=alle.filter(kommt);
  const min=l=>l.reduce((m,o)=>!m||gp(o)<gp(m)?o:m,null);
  return {b:min(jetzt),n:min(spaeter),anzahl:jetzt.length,art:artG(g)};
}

function fahrtHtml(b,liste){

const nurMenge=t=>String(t).length<=24&&/^[\s\d.,x×-]*(?:g|kg|ml|l|liter|stück|stk|er)?(?:[- ]?(?:packung|beutel|flasche|dose|glas|becher|schale|netz))?\s*$/i.test(String(t).trim());
function trefferDaten(){
  const [a,b]=String(S.p||"").split("|"),i=+a,it=S.suche.items[i];
  if(!it||it.status!=="fertig"||!it.karten)return null;
  if(b==="*")return {it,i,alle:true,label:it.name,os:it.karten.flatMap(c=>c.os)};
  const c=it.karten[+b];return c?{it,i,j:+b,c,label:c.label,os:c.os}:null;
}
const trefferTitel=()=>{const d=trefferDaten();return d?(d.alle?d.it.name:d.label):"Angebote"};
function vTreffer(){
  const d=trefferDaten();
  if(!d)return leerHtml("Die Suche ist nicht mehr da","Starte die Suche noch einmal, dann siehst du hier wieder alle Angebote eines Produkts.",`<button type="button" class="knopf haupt" data-go="suchen">Zur Suche</button>`);
  const {it,i}=d,u=unitK(it.art),dis=S.suche.busy?" disabled":"";
  const kartIdx=new Map(it.karten.map((c,j)=>[c.key,j]));
  const sichtbar=d.os.filter(o=>!aus.has(o.markt)),versteckt=d.os.length-sichtbar.length;
  const nachM=new Map();sichtbar.forEach(o=>{const m=mbase(o.markt);if(!nachM.has(m))nachM.set(m,[]);nachM.get(m).push(o)});
  const maerkte=[...nachM].map(([m,os])=>({m,os:os.sort((x,y)=>x.preis_pro_liter-y.preis_pro_liter)})).sort((x,y)=>x.os[0].preis_pro_liter-y.os[0].preis_pro_liter);
  const min=sichtbar.reduce((a,o)=>!a||o.preis_pro_liter<a.preis_pro_liter?o:a,null);
  const groessen=[...new Set(sichtbar.map(o=>o.art==="st"?o.stueck+" Stück":groesseText(o.ml,o.art)))];
  // Kopf: Zusammenfassung, Favorit und Liste wie auf der Kachel
  let knoepfe,hinweis="";
  if(d.alle){const an=istFav(it.name)&&aufListe(it.name);knoepfe=`<button type="button" class="knopf klein${an?" an":""}" data-ia="${i}"${dis}>${an?"✓ Auf der Liste":"＋ Alle Marken auf die Liste"}</button>`}
  else{
    const fav=istFav(d.label),an=fav&&aufListe(d.label),w=an?wahlName(d.label):"";
    knoepfe=`<button type="button" class="knopf klein${fav?" an":""}" data-ik="${i}|${d.j}"${dis}>${fav?"★ Favorit":"☆ Als Favorit"}</button><button type="button" class="knopf klein${an?" an":""}" data-il="${i}|${d.j}"${dis}>${an?"✓ Auf der Liste":"＋ Auf die Liste"}</button>`;
    if(an)hinweis=`<p class="klein-text" style="margin:0">${w?`Steht auf der Liste, du kaufst es bei <b>${esc(w)}</b>. <button type="button" class="knopf klein" data-wahlweg="${esc(d.label)}">Markt wieder automatisch</button>`:"Steht auf der Liste, die App wählt den günstigsten Markt. Unten kannst du einen Markt festlegen."}</p>`;
  }
  let h=`<section class="karte-box"><div class="t-kopf">${bildHtml(sucheBild(sichtbar),d.label)}<div class="mk-t"><b>${esc(d.alle?"Alle Marken":d.label)}</b><small>${sichtbar.length} Angebot${sichtbar.length===1?"":"e"} in ${maerkte.length} Markt${maerkte.length===1?"":"en"}${min?` · ab ${eur(min.preis_pro_liter)}/${u}`:""}</small>${groessen.length?`<small>${esc(groessen.join(", "))}</small>`:""}</div></div>
    <div class="reihe">${knoepfe}</div>${hinweis}</section>`;
  if(!maerkte.length)return h+`<p class="leise-text">Alle Angebote dazu sind in ausgeblendeten Märkten.</p>`;
  h+=`<p class="klein-text" style="margin:0">Günstigster Markt zuerst. Mit „Hier kaufen“ kommt der Artikel auf die Liste und wird dort in diesem Markt eingeplant.</p>`;
  trefferZeilen=[];
  h+=maerkte.map(({m,os},n)=>`<section class="karte-box t-markt"><div class="box-kopf"><h2>${mlogo(m)}${esc(m)}</h2>${n===0&&maerkte.length>1?`<span class="tag gruen">am günstigsten</span>`:""}${kmText(m)?`<span class="rechts km">${kmText(m)}</span>`:""}</div>
    ${os.map(o=>{
      const j=d.alle?kartIdx.get(kKey(o)):d.j;if(j==null)return "";
      const lab=it.karten[j].label,hier=istFav(lab)&&aufListe(lab)&&wahlName(lab)===m;
      trefferZeilen.push({i,j,m});const z=trefferZeilen.length-1;
      const link=o.link&&/^https?:\/\//.test(o.link)?`<a class="t-link" href="${esc(o.link)}" target="_blank" rel="noopener noreferrer">Bei Marktguru ansehen ↗</a>`:"";
      return `<div class="t-z"><div class="mk-t"><b>${esc(d.alle?lab:(o.produkt||lab))}</b><small>${esc(mengeText(o))} · ${eur(o.preis_pro_liter)}/${u} · ${esc(gueltig({von:o.gueltig_von,bis:o.gueltig_bis}))}</small>${o.beschreibung&&!nurMenge(o.beschreibung)?`<small class="t-info">${esc(String(o.beschreibung).slice(0,160))}</small>`:""}${link}</div>
        <div class="mk-p"><b>${eur(o.preis)}</b>${o.preis_alt>o.preis?`<small class="statt">statt ${eur(o.preis_alt)}</small>`:""}</div>
        <button type="button" class="knopf klein t-k${hier?" an":""}" data-tw="${z}"${dis}>${hier?"✓ Hier gekauft":"＋ Hier kaufen"}</button></div>`;
    }).join("")}</section>`).join("");
  if(versteckt)h+=`<p class="klein-text">${versteckt} weitere${versteckt===1?"s":""} Angebot${versteckt===1?"":"e"} in ausgeblendeten Märkten (unter „Mehr“).</p>`;
  return h;
}

/* ---------------- Einkaufsliste mit Marktvergleich ---------------- */
function mengeHtml(k,kurz){   // Menge mit Plus und Minus; bei Packungsware in ganzen Stück
  const art=artG(zk(k).g),a=ARTEN[art],r=zRef(k),wert=r?Math.max(1,Math.round(zettel[k]/r)):zettel[k];
  const ein=r?"Stück à "+groesseText(Math.round(r*1000),art):a.wort;
  const id="m"+[...k].reduce((s,c)=>(s*31+c.charCodeAt(0))>>>0,7).toString(36);
  return `<span class="reihe" style="gap:6px"><span class="stepper"><button type="button" data-schritt="-1" data-k="${esc(k)}" aria-label="weniger">−</button><input id="${id}" type="number" inputmode="${r||art==="st"?"numeric":"decimal"}" min="${r?1:a.min}" step="${r?1:a.step}" value="${String(Math.round(wert*100)/100)}" data-l="${esc(k)}"${r?` data-ref="${r}"`:""} aria-label="Menge ${esc(zLabel(k))}"><button type="button" data-schritt="1" data-k="${esc(k)}" aria-label="mehr">+</button></span>${kurz?"":`<span class="einheit">${esc(ein)}</span>`}</span>`;
}
/* Was der Vergleich für einen Artikel gewählt hat: Markt, Packungen, Preis */
function postenHtml(k,V){
  const b=V.beste;
  if(b&&b.zu[k]){
    const {m,w}=b.zu[k],gr=zMitglieder(k).length>1;
    const pk=w.teile.map(t=>(gr?esc(t.o.gruppe)+": ":"")+t.packs+" × "+mengeText(t.o)).join(" + ");
    return `<div class="posten-info">${b.zu[k].fest?`<span title="Markt selbst gewählt" aria-label="selbst gewählt">📌</span> `:""}${mlogo(m)}<b>${esc(m)}</b> · ${pk} für <b>${eur(w.kosten)}</b> · ${esc(gueltig(w.o))}${w.o.alt?` · statt ${eur(w.o.alt*w.packs)}`:""}</div>`;
  }
  if(b&&b.rw.includes(k))return `<div class="posten-info">Ohne Angebot: ca. ${eur(rwKosten(k))} (${rwEigen(k)!=null?"dein Normalpreis":"Normalpreis-Vorschlag"})</div>`;
  const os=fvAngebote(k).slice().sort((x,y)=>gp(x)-gp(y));
  if(os.length){const o=os[0];return `<div class="posten-info">Im Angebot bei ${mlogo(o.markt)}${esc(mbase(o.markt))} (ab ${eur(gp(o))}/${unitK(o.art)}), aber nicht in den gewählten Märkten</div>`}
  // nur demnächst im Angebot?
  const spaeter=S.lzeit==="jetzt"?offers.filter(o=>zMitglieder(k).some(m=>{const x=zk(m);return grp(o)===x.g&&(!x.ml||o.ml===x.ml)})&&!o.ausb&&!aus.has(o.markt)&&kommt(o)).sort((x,y)=>gp(x)-gp(y))[0]:null;
  return `<div class="posten-info leise">${spaeter?`Ab ${tagD(spaeter.von)} im Angebot bei ${esc(mbase(spaeter.markt))} (${eur(gp(spaeter))}/${unitK(spaeter.art)})`:"Gerade nirgends im Angebot"}${rwPreis(k)==null?" · trag einen Normalpreis ein, dann rechne ich ihn mit":""}</div>`;
}
// Name eines Listenartikels: führt zur Produktseite mit allen Angeboten (von dort weiter zu Marktguru)
const pLink=(x,t)=>istFav(zk(x).g)?`<a href="${esc(hashVon("produkt",zk(x).g))}" class="plink" data-zp="${esc(x)}" title="Alle Angebote für ${esc(zLabel0(x))} ansehen">${esc(t)}</a>`:esc(t);
function wahlHtml(k,V){   // Markt für einen Artikel selbst festlegen (sonst der günstigste im besten Plan)
  const mk=Object.keys(V.t).filter(m=>V.t[m][k]).map(m=>({m,w:V.t[m][k]})).sort((a,b)=>a.w.kosten-b.w.kosten),wv=wahlVon(k);
  if(mk.length<2&&!wv)return "";
  const id="w"+[...k].reduce((s,c)=>(s*31+c.charCodeAt(0))>>>0,7).toString(36);
  const opt=[["","Günstigster (automatisch)"],...mk.map(x=>[x.m,x.m+" · "+eur(x.w.kosten)]),...(wv&&!mk.some(x=>x.m===wv)?[[wv,wv+" · gerade kein Angebot"]]:[])];
  return `<label class="rw wahl">Markt ${sel(id,`data-wahl="${esc(k)}"`,opt,wv,"Markt für "+zLabel(k))}</label>${wv&&!V.fest[k]?`<div class="klein-text">Bei ${esc(wv)} gibt es das ${S.lzeit==="jetzt"?"gerade":"demnächst"} nicht im Angebot, deshalb zählt der günstigste Markt.</div>`:""}`;
}
function zeileHtml(k,V){
  const mit=zMitglieder(k),a=ARTEN[artG(zk(k).g)],rw=rwPreis(k),ref=zRef(k);   // Normalpreis bei Packungsware je Stück, gespeichert je kg bzw. Liter
  const vor=rwEigen(k)==null?rwVorschlag(k):null;   // Vorschlag aus „statt …“, solange du keinen eigenen Preis einträgst
  const rwId="r"+[...k].reduce((s,c)=>(s*31+c.charCodeAt(0))>>>0,7).toString(36);
  // bei zusammengelegten Artikeln führt der Name zu dem, dessen Angebot gewählt ist (sonst zum günstigsten)
  let ziel=k;
  if(mit.length>1){const w=V.beste&&V.beste.zu[k]?V.beste.zu[k].w.teile[0].o:fvAngebote(k).slice().sort((x,y)=>gp(x)-gp(y))[0];ziel=(w&&mit.find(m=>zk(m).g===grp(w)&&(!zk(m).ml||zk(m).ml===w.ml)))||mit.find(m=>zk(m).g===(w&&grp(w)))||mit[0]}

    <div class="mengen">${mengeHtml(k)}<label class="rw" title="${vor?`Vorschlag: früherer Preis bei ${esc(mbase(vor.o.markt))} (statt ${eur(vor.o.alt)}). Trag einen eigenen Preis ein, um ihn zu ersetzen.`:"Was der Artikel normalerweise kostet. Gilt, wenn es kein günstigeres Angebot gibt."}">Normalpreis <input id="${rwId}"${vor?` class="vorschlag"`:""} inputmode="decimal" placeholder="–" value="${rw!=null?(ref?(Math.round(rw*ref*100)/100).toFixed(2).replace(".",","):zt(rw)):""}" data-r="${esc(k)}"${ref?` data-ref="${ref}"`:""} aria-label="Normalpreis in Euro je ${ref?"Stück":a.u}${vor?", Vorschlag":""}"> € je ${ref?"Stück":a.u}</label>${vor?`<small class="vorschlag-text">Vorschlag aus dem früheren Preis („statt“) bei ${esc(mbase(vor.o.markt))}</small>`:""}${wahlHtml(k,V)}</div></div>`;
}
const listeText=l=>l.map(x=>esc(zLabel(x))).join(", ");
function bonHtml(V){

  }else{const von=os.filter(x=>x.o.von).sort((x,y)=>x.o.von<y.o.von?1:-1)[0];if(von)frist=`<div>📅 Alle Angebote gelten ab ${tagD(von.o.von).replace(/\.$/,"")}.</div>`}
  let tourText="";
  if(b.ms.length===2){
    const tf=b.tour||tourFahrt(b.ms),einzel=b.ms.reduce((s,m)=>s+(fvFahrt(m)||0),0);
    if(tf&&b.ms.every(m=>fvFahrt(m)!=null)){const dd=einzel-tf.kosten;tourText=b.tour?`<div class="klein-text">Einzeln hin und zurück wären es ${eur(einzel)} Fahrt, die Tour ${dd>0.004?"spart "+eur(dd):"kostet "+eur(-dd)+" mehr"}.</div>`:`<div class="klein-text">Als eine Tour (${tf.reihe.map(esc).join(" → ")}, ${f1(tf.km)} km) wären es ${eur(tf.kosten)} Fahrt.</div>`}

  const vglText=v?`<div>Zum Vergleich nur ${esc(v.ms[0])}${kmText(v.ms[0])?" ("+kmText(v.ms[0])+")":""}: ${v.anzahl} von ${n} im Angebot, ${eur(v.gesamt)}${v.offen.length?` + ${v.offen.length} ohne Angebot`:""}.${diff>0.3?` <span class="spart">Du sparst ${geschaetzt?"etwa ":""}${eur(diff)}.</span>`:""}</div>`:"";
  return `<div class="bon"><div class="bon-kopf"><small>Beste Wahl ${S.lzeit==="jetzt"?"jetzt":"demnächst"}</small><b>${b.ms.map(m=>mlogo(m)+esc(m)).join(" + ")}</b><span class="km">${b.anzahl} von ${n} Artikeln im Angebot${b.ms.length===1&&kmText(b.ms[0])?" · "+kmText(b.ms[0]):""}</span></div>
    <div class="bon-zeilen"><div class="bon-z"><span>Angebote</span><span>${eur(b.ware)}</span></div>
    ${b.rwSumme>0?`<div class="bon-z"><span>Ohne Angebot, zu deinen Normalpreisen (ca.)</span><span>${eur(b.rwSumme)}</span></div>`:""}
    <div class="bon-z"><span>${b.tour?`Fahrt als Tour (${b.tour.reihe.map(esc).join(" → ")}, ${f1(b.tour.km)} km)`:`Fahrt${b.ms.length>2?" (alle Märkte, hin und zurück)":b.ms.length>1?" (beide Märkte, hin und zurück)":" (hin und zurück)"}`}</span><span>${b.unbekannt?"unbekannt":eur(b.fahrt)}</span></div>
    <div class="bon-z summe"><span>Zusammen${b.offen.length+V.fehlend.length?" (ohne "+(b.offen.length+V.fehlend.length)+" Artikel)":""}</span><span>${eur(b.gesamt)}</span></div></div>

}

const JEDES=9999;   // Wunschpreis "bei jedem Angebot"
function alarmEinheiten(art){return art==="kg"?[["kg","€ je kg"]]:art==="st"?[["st","€ je Stück"]]:[["l","€ je Liter"],["stueck","€ je Flasche/Dose"]]}
function alarmErreicht(g,al){
  if(!al)return null;

}
function alarmTag(g){
  const f=favVon(g),al=f&&f.alarm;if(!al)return"";

function alarmZeile(f){

    if(e&&!jedes)h+=`<div class="klein-text">Erreicht: ${esc(mbase(e.markt))}, ${mengeText(e)} für ${eur(pr(e))} (${esc(gueltig(e))}). Die Nachricht kommt beim nächsten Lauf, einmal je Angebot.</div>`;
    h+=`</div>`;
  }
  return h+`</div>`;
}

/* ---------- Suche: eine Zeile je Artikel, Mengen wie "2 kg Äpfel" ---------- */
function sucheParsen(t){
  let zeilen=String(t||"").split(/\r?\n/).map(z=>z.trim()).filter(Boolean);
  if(zeilen.length===1&&zeilen[0].includes(","))zeilen=zeilen[0].split(",").map(z=>z.trim()).filter(Boolean);
  const out=[],seen=new Set();
  zeilen.forEach(z=>{
    z=z.replace(/^(?:[-•*·–]|[☐☑✓✔□○◯]|\[[ xX]?\])+\s*/,"").replace(/^\d+[.)]\s+/,"").trim();
    let menge=null;
    const m=z.match(/^(\d+(?:[.,]\d+)?)\s*(kg|gramm|g|liter|ml|l|x|stk\.?|stück)?\s+(.+)$/i);
    if(m){menge={wert:parseFloat(m[1].replace(",",".")),einheit:(m[2]||"").toLowerCase().replace(".","").replace("gramm","g").replace("liter","l")};z=m[3]}
    z=z.replace(/[,|]/g," ").replace(/\s+/g," ").trim().slice(0,40);
    if(z.length<2||seen.has(z.toLowerCase()))return;
    seen.add(z.toLowerCase());
    const eh=menge?(menge.einheit==="kg"||menge.einheit==="g"?"kg":menge.einheit==="l"||menge.einheit==="ml"?"l":"st"):"st";
    out.push({name:z,menge,roh:[],karten:[],art:"l",status:"wartet",einheit:eh});
  });
  return out.slice(0,40);
}
function mengeUmrechnen(m,art){   // gewünschte Menge in kg, Liter oder Stück; passt die Einheit nicht, gilt die Standardmenge
  if(!m||!(m.wert>0))return null;
  const e=m.einheit;let v=null;
  if(e==="kg")v=art==="kg"?m.wert:null;else if(e==="g")v=art==="kg"?m.wert/1000:null;
  else if(e==="l")v=art==="l"?m.wert:null;else if(e==="ml")v=art==="l"?m.wert/1000:null;
  else v=art==="kg"?null:m.wert;
  return v&&v>0&&v<=500?Math.round(v*100)/100:null;
}
const mengeAnzeige=m=>m?zt(m.wert)+(m.einheit&&m.einheit!=="x"?" "+m.einheit:"×"):"";
function favLabel(c){const m=(c.marke||"").trim(),p=(c.produkt||"").trim();return (!m?p:!p?m:p.toLowerCase().includes(m.toLowerCase())?p:m+" "+p).replace(/[,|]/g," ").replace(/\s+/g," ").trim().slice(0,40)||"?"}
function ergKarten(l){   // Suchergebnisse je Produkt (Marke bzw. Name)
  const heute=new Date().toISOString().slice(0,10),map=new Map(),schon=new Set();
  (l||[]).filter(x=>x&&x.preis>0&&x.liter>0&&!(x.gueltig_bis&&x.gueltig_bis<heute)).forEach(x=>{
    // dasselbe Angebot kann aus zwei Postleitzahlen kommen (z. B. PENNY), es zählt einmal
    const d=[mbase(x.markt),x.marke,x.produkt,x.preis,x.stueck,x.ml,x.gueltig_von,x.gueltig_bis].join("|");if(schon.has(d))return;schon.add(d);
    const k=(x.marke||x.produkt||"").trim().toLowerCase();if(!k)return;
    const c=map.get(k)||{key:k,marke:x.marke||"",produkt:x.produkt||"",bild:"",os:[]};
    if(!c.bild&&x.bild&&/^https?:\/\//.test(x.bild))c.bild=x.bild;
    c.os.push(x);map.set(k,c);
  });
  return [...map.values()].map(c=>{
    const z={};c.os.forEach(o=>{z[o.art||"l"]=(z[o.art||"l"]||0)+1});
    const art=Object.entries(z).sort((a,b)=>b[1]-a[1])[0][0],os=c.os.filter(o=>(o.art||"l")===art).sort((a,b)=>a.preis_pro_liter-b.preis_pro_liter);
    c.art=art;c.os=os;c.label=favLabel(c);c.min=os[0];

    return c;
  }).sort((a,b)=>b.os.length-a.os.length||a.min.preis_pro_liter-b.min.preis_pro_liter).slice(0,40);

/* ---------- Meintest du …? Ähnliche Namen aus allen Angeboten der Gegend (bei Tippfehlern) ---------- */
function abstand(a,b,max){   // Tippfehler-Abstand (Buchstabe falsch, fehlt, zu viel oder vertauscht); über max wird abgebrochen
  if(Math.abs(a.length-b.length)>max)return max+1;
  let p2=null,p=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){
    const c=[i];let lo=i;
    for(let j=1;j<=b.length;j++){
      let v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));
      if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])v=Math.min(v,p2[j-2]+1);
      c[j]=v;if(v<lo)lo=v;
    }
    if(lo>max)return max+1;p2=p;p=c;
  }
  return p[b.length];
}
function aehnlich(q,namen,anzahl=3){
  const qz=nurK(q);if(qz.length<3)return[];
  const g=qz.length<=4?1:qz.length<=8?2:3,erg=[];
  (namen||[]).forEach((n,rang)=>{
    const nz=nurK(n);if(!nz||nz===qz)return;
    let d=abstand(qz,nz,g),vor=n;
    if(d>g){   // ein einzelnes Wort des Namens, auch als Wortanfang ("hydro" -> "Hidrofugal")
      let best=99;
      String(n).split(/[^A-Za-zÄÖÜäöüß0-9]+/).filter(w=>w.length>=3).forEach(w=>{
        const wz=nurK(w);if(wz===qz)return;
        let x=abstand(qz,wz,g);
        if(qz.length>=4&&wz.length>qz.length){const y=abstand(qz,wz.slice(0,qz.length),1);if(y<=1&&y+.5<x)x=y+.5}
        if(x<best){best=x;vor=w}
      });
      if(best>g)return;d=best;
    }
    erg.push({vor:String(vor).trim(),d,rang});
  });
  const schon=new Set([qz]),out=[];
  erg.sort((a,b)=>a.d-b.d||a.rang-b.rang).forEach(x=>{const k=nurK(x.vor);if(out.length<anzahl&&!schon.has(k)){schon.add(k);out.push(x.vor)}});
  return out;
}

async function meintest(i,wort){

async function serverSuche(begriffe){

async function sucheStarten(){

function ergebnisSetzen(x,l){
  const r=l.filter(o=>String(o.gruppe).toLowerCase()===x.name.toLowerCase()&&o.preis>0&&o.liter>0);
  const z={};r.forEach(o=>{z[o.art||"l"]=(z[o.art||"l"]||0)+1});
  x.art=(Object.entries(z).sort((a,b)=>b[1]-a[1])[0]||["l"])[0];
  x.roh=r.filter(o=>(o.art||"l")===x.art);x.karten=ergKarten(x.roh);x.status="fertig";
